<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yuting's Life</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet" />
  <link href="https://db.onlinewebfonts.com/c/5ac3fe7c6abd2f62067f266d89671492?family=HelveticaNowDisplay-Medium" rel="stylesheet" />
  <link href="https://db.onlinewebfonts.com/c/1aa3377e489837a26d019bba501e779d?family=HelveticaNowDisplayW01-Rg" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
            ring: 'hsl(var(--ring))',
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            primary: { DEFAULT: 'hsl(var(--primary))', foreground: 'hsl(var(--primary-foreground))' },
            secondary: { DEFAULT: 'hsl(var(--secondary))', foreground: 'hsl(var(--secondary-foreground))' },
            destructive: { DEFAULT: 'hsl(var(--destructive))', foreground: 'hsl(var(--destructive-foreground))' },
            muted: { DEFAULT: 'hsl(var(--muted))', foreground: 'hsl(var(--muted-foreground))' },
            accent: { DEFAULT: 'hsl(var(--accent))', foreground: 'hsl(var(--accent-foreground))' },
            card: { DEFAULT: 'hsl(var(--card))', foreground: 'hsl(var(--card-foreground))' },
          },
          borderRadius: { lg: 'var(--radius)', md: 'calc(var(--radius) - 2px)', sm: 'calc(var(--radius) - 4px)' },
        },
      },
    };
  </script>
  <style>
    /* Shadcn UI theme：与 rain 初始界面一致 — 荧光绿 + 毛玻璃 */
    :root {
      --background: 0 0% 100%;
      --foreground: 0 0% 8%;
      --card: 0 0% 100%;
      --card-foreground: 0 0% 8%;
      --primary: 0 0% 8%;
      --primary-foreground: 0 0% 100%;
      --secondary: 0 0% 96%;
      --secondary-foreground: 0 0% 8%;
      --muted: 0 0% 96%;
      --muted-foreground: 0 0% 40%;
      --accent: 0 0% 8%;
      --accent-foreground: 0 0% 100%;
      --destructive: 0 84% 60%;
      --destructive-foreground: 0 0% 98%;
      --border: 0 0% 90%;
      --input: 0 0% 90%;
      --ring: 0 0% 8%;
      --radius: 0.75rem;
      --radius-card: 24px;
      --black: #111111;
      --white: #ffffff;
      --green: #111111;
      --green-light: #333333;
      --glow-hex: #111111;
      --glass: #ffffff;
      --glass-border: rgba(0, 0, 0, 0.1);
      --gap: clamp(1.5rem, 4vw, 3rem);
      --title-font: 'Orbitron', 'Bebas Neue', sans-serif;
      --title-glow: none;
      --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      --font-heading: 'HelveticaNowDisplay-Medium', 'Helvetica Neue', Arial, sans-serif;
      --font-body: 'HelveticaNowDisplayW01-Rg', 'Helvetica Neue', Arial, sans-serif;
    }
    /* Shadcn-style 组件：保留科技感 */
    /* 统一卡片：rain 同款毛玻璃 + 悬停上浮与荧光绿发光 */
    .card {
      border-radius: var(--radius-card);
      border: 1px solid var(--glass-border);
      background: var(--glass);
      color: hsl(var(--card-foreground));
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
      transition: transform var(--transition), box-shadow var(--transition-slow), border-color var(--transition);
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      border-color: rgba(0, 0, 0, 0.2);
    }
    .card-header { padding: 1.25rem 1.5rem 0.5rem; }
    .card-title { font-family: var(--title-font); font-weight: 600; font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: 0.1em; margin-bottom: 0.5rem; color: hsl(var(--card-foreground)); text-shadow: none; }
    .card-title .title-accent { color: #111; text-shadow: none; }
    .card-description { color: hsl(var(--muted-foreground)); font-size: 0.95rem; margin-top: 0.25rem; }
    .card-content { padding: 0.5rem 1.5rem 1.25rem; }
    .about-intro-text { color: hsl(var(--muted-foreground)); font-size: 0.95rem; max-width: 42ch; white-space: pre-line; line-height: 1.65; }
    .skills-heading { font-family: var(--title-font); font-weight: 600; font-size: clamp(2.5rem, 6vw, 4rem); letter-spacing: 0.12em; color: hsl(var(--foreground)); margin-bottom: 1.5rem; text-shadow: none; text-align: center; }
    .skills-icons { display: flex; flex-wrap: wrap; gap: 1rem; transition: transform var(--transition); }
    .skills-icons img { width: 40px; height: 40px; object-fit: contain; filter: brightness(0); opacity: 0.9; }
    .btn { display: inline-flex; align-items: center; justify-content: center; border-radius: calc(var(--radius) - 4px); font-size: 0.875rem; font-weight: 500; transition: background var(--transition), color var(--transition); cursor: pointer; }
    .btn-ghost { background: transparent; color: hsl(var(--foreground)); padding: 0.5rem 1rem; }
    .btn-ghost:hover { background: hsl(var(--accent)); color: hsl(var(--accent-foreground)); }
    .btn-ghost.active { background: hsl(var(--accent)); color: hsl(var(--accent-foreground)); }
    .badge { display: inline-flex; align-items: center; border-radius: 9999px; border: 1px solid hsl(var(--border)); padding: 0.15rem 0.6rem; font-size: 0.75rem; font-weight: 500; background: hsl(var(--primary) / 0.3); color: hsl(var(--primary-foreground)); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: #fff;
      color: #111;
      line-height: 1.6;
      overflow-x: hidden;
    }
    body.intro-done .intro-overlay { opacity: 0; pointer-events: none; transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
    body.intro-done .intro-glow { opacity: 0; transform: scale(2); transition: opacity 1.5s ease, transform 2s ease; }
    body.intro-done .reveal { opacity: 1; transform: translateY(0); }

    /* 电影级开场：光晕先亮起 */
    .intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      pointer-events: none;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .intro-glow {
      display: none;
    }
    @keyframes glow-pulse {
      0% { opacity: 0; transform: scale(0.3); }
      40% { opacity: 1; transform: scale(1); }
      100% { opacity: 0.6; transform: scale(1.2); }
    }
    @keyframes border-flow {
      to { transform: rotate(360deg); }
    }

    /* 全站背景图：与光晕同时入场，内容加载后调暗 */
    .page-bg {
      display: none;
    }
    .page-bg::after { display: none; }
    @keyframes bg-reveal {
      0% { opacity: 0; }
      35% { opacity: 1; }
      100% { opacity: 1; }
    }
    body.intro-done .page-bg { animation: none; opacity: 1; }

    /* 主内容：淡入 + 上浮，依次出现 */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .reveal.reveal-nav { transition-delay: 0.4s; }
    .reveal.reveal-home { transition-delay: 0.6s; }
    .reveal.reveal-about { transition-delay: 0.85s; }
    .reveal.reveal-experience { transition-delay: 1.05s; }
    .reveal.reveal-projects { transition-delay: 1.15s; }
    .reveal.reveal-boxing { transition-delay: 1.35s; }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    #nav, #home, #about, #experience, #projects, #boxing { font-family: var(--font-body); color: #111; }
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      padding: 1rem 1.25rem;
      display: flex; align-items: center;
      background: rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.4);
      transition: background 0.3s ease, border-color 0.3s ease;
    }
    @media (min-width: 640px) {
      .nav { padding: 1.25rem 2rem; }
    }
    .nav.scrolled {
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-bottom-color: rgba(255, 255, 255, 0.5);
    }
    .nav-inner { width: 100%; position: relative; z-index: 2; display: flex; align-items: center; justify-content: flex-end; }
    @media (min-width: 768px) {
      .nav-inner { display: grid; grid-template-columns: 1fr auto 1fr; }
      .nav-menu { justify-self: center; grid-column: 2; }
      .nav-cta { justify-self: end; grid-column: 3; }
    }
    .nav-menu {
      display: none;
      position: static;
      left: auto;
      transform: none;
      flex-direction: row;
      align-items: center;
      font-family: var(--font-body);
      font-size: 20px;
      color: #000;
      white-space: nowrap;
      gap: 2ch;
    }
    .nav-menu a {
      color: #888;
      text-decoration: none;
      font-family: var(--font-body);
      font-size: 20px;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
      padding: 0;
      border: none;
      background: none;
      backdrop-filter: none;
      border-radius: 0;
      transition: color 0.2s ease, font-family 0.2s ease, letter-spacing 0.2s ease;
    }
    .nav-menu a:hover {
      color: #555;
      background: none;
      border: none;
      transform: none;
      box-shadow: none;
    }
    .nav-menu a.active {
      color: #111;
      font-family: var(--title-font);
      font-weight: 600;
      letter-spacing: 0.08em;
    }
    .nav-cta {
      display: none;
      color: #000;
      font-size: 20px;
      text-decoration: underline;
      text-underline-offset: 2px;
      transition: opacity 0.2s ease;
    }
    .nav-cta:hover { opacity: 0.6; }
    @media (min-width: 768px) {
      .nav-menu { display: flex; }
      .nav-cta { display: inline; }
    }
    .nav-overlay {
      position: fixed;
      inset: 0;
      z-index: 9;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 0 2rem;
      gap: 2rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .nav-overlay.is-open { opacity: 1; pointer-events: auto; }
    .nav-overlay-menu { display: flex; flex-direction: column; align-items: flex-start; gap: 2rem; }
    .nav-overlay-menu a {
      color: #888;
      text-decoration: none;
      font-family: var(--font-body);
      font-size: 32px;
      font-weight: 400;
      transition: color 0.2s ease;
    }
    .nav-overlay-menu a:hover { color: #555; }
    .nav-overlay-menu a.active {
      color: #111;
      font-family: var(--title-font);
      font-weight: 600;
      letter-spacing: 0.08em;
    }
    .nav-overlay-cta { color: #111 !important; text-decoration: underline !important; text-underline-offset: 2px; }
    @media (min-width: 768px) {
      .nav-overlay { display: none !important; }
    }
    section { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: calc(var(--gap) * 2); position: relative; }
    .section-inner { max-width: 1200px; width: 100%; }
    #home {
      background-color: #fff;
      position: relative;
      overflow: hidden;
      z-index: 1;
      min-height: 100vh;
      height: 100vh;
      color: #111;
    }
    #home .section-inner {
      position: relative;
      z-index: 10;
      display: block;
    }
    .home-media {
      position: absolute;
      top: 0;
      left: 50%;
      right: 0;
      bottom: 0;
      z-index: 0;
      height: 100%;
      width: 50%;
      display: flex;
      align-items: stretch;
      justify-content: flex-start;
      pointer-events: none;
      overflow: hidden;
    }
    .home-bg-video {
      display: block;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: 100%;
      object-fit: cover;
      object-position: left center;
    }
    .home-video-fade {
      display: block;
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(to right, #fff 0%, rgba(255,255,255,0.75) 10%, rgba(255,255,255,0.22) 28%, transparent 48%),
        linear-gradient(to left, #fff 0%, transparent 14%),
        linear-gradient(to bottom, #fff 0%, transparent 12%),
        linear-gradient(to top, #fff 0%, transparent 14%);
    }
    .home-content {
      position: relative;
      z-index: 10;
      text-align: left;
      min-width: 0;
      max-width: 50rem;
    }
    .home-title {
      font-family: var(--title-font);
      font-weight: 700;
      font-size: clamp(2.8rem, 8vw, 6.2rem);
      letter-spacing: 0.06em;
      line-height: 1.08;
      color: #111;
      margin-bottom: 0;
    }
    .home-title .title-accent {
      display: inline-block;
      font-size: 1.22em;
      line-height: 1.02;
    }
    .home-subtitle {
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: hsl(var(--muted-foreground));
      margin-top: 1.35em;
      margin-bottom: 2rem;
    }
    .home-pills {
      display: flex;
      flex-wrap: wrap;
      row-gap: 0.25rem;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .home-pills.is-visible { opacity: 1; transform: translateY(0); }
    .home-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      appearance: none;
      -webkit-appearance: none;
      background: #111;
      color: #fff;
      border: 1px solid #000;
      border-radius: 9999px;
      font-size: 13px;
      padding: 0.3em 1rem;
      margin: 0 0.2em 0.4em;
      white-space: nowrap;
      text-decoration: none;
      cursor: pointer;
      font-family: inherit;
      line-height: 1.4;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28), 0 0 0 1px rgba(0, 0, 0, 0.35);
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    @media (min-width: 640px) {
      .home-pill { font-size: 15px; padding: 0.3em 1.25rem; }
    }
    .home-pill:hover {
      background: #000;
      color: #fff;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(0, 0, 0, 0.5);
    }
    .home-pill-outline {
      color: #111;
      background: #fff;
      border: 1px solid #111;
      gap: 0.5rem;
    }
    @media (min-width: 640px) { .home-pill-outline { gap: 0.75rem; } }
    .home-pill-outline:hover { background: #111; color: #fff; }
    .home-pill-outline u { text-underline-offset: 1px; }
    .home-copy-icon { width: 12px; height: 12px; flex-shrink: 0; }
    #about, #experience, #projects, #boxing { background: #fff; }
    #about {
      position: relative;
      overflow: hidden;
      min-height: 100vh;
      align-items: stretch;
      --nav-clearance: 5.25rem;
    }
    #about .section-inner {
      position: relative;
      z-index: 10;
      display: block;
      width: 100%;
      min-height: 100%;
      pointer-events: none;
    }
    .about-media {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 50%;
      z-index: 1;
      width: 50%;
      height: auto;
      display: flex;
      align-items: stretch;
      justify-content: flex-start;
      overflow: hidden;
      pointer-events: auto;
    }
    #about-pixel-swap {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .about-left-col {
      display: flex;
      flex-direction: column;
      min-height: 0;
      max-width: min(50%, 36rem);
      pointer-events: auto;
    }
    .about-me {
      flex: 3;
      padding-right: 0.5rem;
    }
    .about-me .about-title { font-family: var(--title-font); font-weight: 600; font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: 0.1em; color: #111; margin-bottom: 0.5rem; text-shadow: none; }
    .about-me .about-intro-text { color: hsl(var(--muted-foreground)); font-size: 0.95rem; max-width: 42ch; white-space: pre-line; line-height: 1.65; margin-bottom: calc(1.65em * 2); }
    .skills-card {
      flex: 2;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .skills-card .card-header { padding: 1.25rem 1.5rem 0.5rem; }
    .skills-card .card-title { font-size: clamp(1.1rem, 2.5vw, 1.5rem); letter-spacing: 0.08em; margin-bottom: 0.5rem; }
    .skills-card .card-content { padding: 0.5rem 1.5rem 1.25rem; flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 0.5rem; }
    .skills-card .skills-desc { margin: 0 0 0.5rem; font-size: 0.95rem; max-width: none; color: hsl(var(--muted-foreground)); }
    .skills-card .skills-icons { gap: 1rem; justify-content: flex-start; }
    .skills-card .skills-icons img { width: 40px; height: 40px; }
    .about-lanyard {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .experience-title { font-family: var(--title-font); font-weight: 600; font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: 0.1em; color: #111; margin-bottom: 2.5rem; text-shadow: none; }
    .experience-list { list-style: none; display: flex; flex-direction: column; gap: 1.75rem; margin: 0; padding: 0; }
    .experience-item {
      display: grid;
      grid-template-columns: 9.5rem 2rem 1fr;
      align-items: start;
      column-gap: 1.25rem;
      position: relative;
    }
    .experience-period {
      padding-top: 1.35rem;
      text-align: right;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      color: hsl(var(--muted-foreground));
      white-space: nowrap;
      transition: color var(--transition), text-shadow var(--transition);
    }
    .experience-axis {
      position: relative;
      width: 2rem;
      align-self: stretch;
      display: flex;
      justify-content: center;
    }
    .experience-axis::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: -1.75rem;
      left: 50%;
      width: 1px;
      background: rgba(17, 17, 17, 0.18);
      transform: translateX(-50%);
    }
    .experience-item:last-child .experience-axis::before { bottom: auto; height: 1.45rem; }
    .experience-dot {
      position: relative;
      z-index: 1;
      width: 14px;
      height: 14px;
      margin-top: 1.45rem;
      border-radius: 50%;
      border: 1.5px solid #111;
      background: #fff;
      flex-shrink: 0;
      transition: box-shadow var(--transition), transform var(--transition);
    }
    .experience-item:hover .experience-period {
      color: #111;
      text-shadow: 0 2px 10px rgba(17, 17, 17, 0.28), 0 1px 3px rgba(17, 17, 17, 0.16);
    }
    .experience-item:hover .experience-dot {
      transform: scale(1.12);
      box-shadow: 0 4px 14px rgba(17, 17, 17, 0.32), 0 0 0 3px rgba(17, 17, 17, 0.06);
    }
    .experience-card { padding: 1.25rem 1.5rem; }
    .experience-card .experience-role {
      font-family: var(--font-heading);
      font-size: 1.1rem;
      font-weight: 500;
      color: #111;
      margin-bottom: 0.4rem;
      letter-spacing: 0.01em;
    }
    .experience-card .experience-summary {
      color: hsl(var(--muted-foreground));
      font-size: 0.95rem;
      line-height: 1.65;
      margin: 0;
    }
    #projects { background: #fff; }
    .projects-title { font-family: var(--title-font); font-weight: 600; font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: 0.1em; color: #111; margin-bottom: 2.5rem; text-shadow: none; }
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.75rem;
    }
    .project-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      border: none;
      border-radius: 28px;
      overflow: visible;
      padding: 12px 12px 1.15rem;
      background: #fff;
      cursor: pointer;
      text-align: left;
      box-shadow: 0 12px 32px rgba(17, 17, 17, 0.08);
      transition: transform var(--transition), box-shadow var(--transition-slow);
    }
    .project-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 40px rgba(17, 17, 17, 0.12);
    }
    .project-card-cover {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      object-position: top center;
      border-radius: 20px;
      background: #f3f3f3;
      box-shadow: 0 8px 22px rgba(17, 17, 17, 0.16);
      transition: transform 0.6s ease, box-shadow 0.3s ease;
    }
    .project-card:hover .project-card-cover { transform: none; }
    .project-card-body {
      position: relative;

  <script>
    var CONFIG_URL = 'source/config.json';
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.body.classList.add('intro-done');
    } else {
      setTimeout(function() { document.body.classList.add('intro-done'); }, 500);
    }
    var paths = { pics: '', icons: '', videos: '', contents: '' };
    function resolvePath(path) {
      if (!path || !paths.pics) return path || '';
      if (path.startsWith('pics/')) return paths.pics + '/' + path.slice(5);
      if (path.startsWith('icons/')) return paths.icons + '/' + path.slice(6);
      if (path.startsWith('videos/')) return paths.videos + '/' + path.slice(7);
      return path;
    }
    function pathJoin(base, filename) {
      if (!base || !filename) return '';
      return base.replace(/\/$/, '') + '/' + filename;
    }
    function pageBase() {
      var p = location.pathname || '/';
      if (p.endsWith('/')) return p;
      var last = p.split('/').pop() || '';
      if (/\.[a-zA-Z0-9]+$/.test(last)) return p.slice(0, p.lastIndexOf('/') + 1) || '/';
      return p + '/';
    }
    function resolveAsset(rel) {
      if (!rel) return '';
      if (/^(https?:|data:|blob:|\/)/i.test(rel)) return rel;
      return pageBase() + rel.replace(/^\.\//, '');
    }
    function videoPosterUrl(filename) {
      if (!filename) return '';
      return resolveAsset(pathJoin(paths.videos, filename.replace(/\.[^.]+$/, '') + '.jpg'));
    }
    function getPageAsset(config, pageId, key) {
      if (!config || !config.pages || !config.pages[pageId]) return '';
      var name = config.pages[pageId][key];
      if (!name) return '';
      return resolveAsset(pathJoin(paths.pics, name));
    }
    function getPageVideo(config, pageId, key) {
      if (!config || !config.pages || !config.pages[pageId]) return '';
      var name = config.pages[pageId][key];
      if (!name) return '';
      return resolveAsset(pathJoin(paths.videos, name));
    }
    function getPageMediaList(config, pageId) {
      if (!config || !config.pages || !config.pages[pageId] || !config.pages[pageId].media) return [];
      if (!paths.pics || !paths.videos) return [];
      return config.pages[pageId].media.map(function(item) {
        var src = item.type === 'video' ? resolveAsset(pathJoin(paths.videos, item.src)) : resolveAsset(pathJoin(paths.pics, item.src));
        var thumb = item.type === 'video' ? resolveAsset(pathJoin(paths.videos, item.thumb || item.src)) : resolveAsset(pathJoin(paths.pics, item.thumb || item.src));
        return { type: item.type, src: src, thumb: thumb };
      });
    }
    async function loadJSON(path) { var res = await fetch(path); if (!res.ok) return null; return res.json(); }
    function escapeHtml(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    function titleWithAccent(text, mode) {
      if (!text || typeof text !== 'string') return '';
      if (text.indexOf('\n') >= 0) {
        var lines = text.split('\n');
        return lines.map(function(line, i) {
          return titleWithAccent(line, i === lines.length - 1 ? (mode || 'last') : 'none');
        }).join('<br>');
      }
      var words = text.trim().split(/\s+/);
      if (words.length === 0) return '';
      if (words.length === 1) return mode === 'none' ? escapeHtml(words[0]) : '<span class="title-accent">' + escapeHtml(words[0]) + '</span>';
      var start = -1, end = -1;
      if (mode === 'none') { start = -1; end = -1; }
      else if (mode === 'last') { start = words.length - 1; end = words.length - 1; }
      else if (words.length === 2) { start = 1; end = 1; }
      else { var mid = Math.floor(words.length / 2); end = mid; start = words.length % 2 ? mid : mid - 1; }
      var html = '';
      for (var i = 0; i < words.length; i++) {
        if (i > 0) html += ' ';
        html += (start >= 0 && i >= start && i <= end) ? '<span class="title-accent">' + escapeHtml(words[i]) + '</span>' : escapeHtml(words[i]);
      }
      return html;
    }
    function menuLinkHtml(m) {
      var href = (m.url != null && m.url !== '') ? m.url : ('#' + (m.id || ''));
      return '<a href="' + href + '">' + escapeHtml(m.label || m.id || '') + '</a>';
    }
    function setNav(site) {
      if (!site) return;
      var menuEl = document.getElementById('nav-menu');
      var overlayEl = document.getElementById('nav-overlay-menu');
      if (site.menu && Array.isArray(site.menu)) {
        if (menuEl) menuEl.innerHTML = site.menu.map(menuLinkHtml).join('');
        if (overlayEl) {
          overlayEl.innerHTML = site.menu.map(menuLinkHtml).join('') +
            '<a href="#" class="nav-overlay-cta" id="nav-overlay-cta">Get in touch</a>';
        }
      }
    }
    function contactHref(c) {
      if (!c || !c.value) return '#';
      if (c.value.indexOf('http') === 0) return c.value;
      if (c.label === 'Email') return 'mailto:' + c.value;
      return 'https://' + c.value;
    }
    function copyIconSvg() {
      return '<svg class="home-copy-icon" viewBox="0 0 12 12" fill="none" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="1.5" y="1.5" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.2"/></svg>';
    }
    function startTypewriter(textEl, cursorEl, text, speed, startDelay) {
      speed = speed || 38;
      startDelay = startDelay == null ? 600 : startDelay;
      var i = 0;
      function tick() {
        if (!textEl) return;
        if (i <= text.length) {
          textEl.textContent = text.slice(0, i);
          i += 1;
          setTimeout(tick, speed);
        } else if (cursorEl) {
          cursorEl.classList.add('is-done');
        }
      }
      setTimeout(tick, startDelay);
    }
    function setHomeCta(email) {
      var href = email ? 'mailto:' + email : '#';
      var cta = document.getElementById('nav-cta');
      var overlayCta = document.getElementById('nav-overlay-cta');
      if (cta) cta.href = href;
      if (overlayCta) overlayCta.href = href;
    }
    function setHome(data, config) {
      if (!data) return;
      var titleEl = document.getElementById('home-title');
      var subEl = document.getElementById('home-subtitle');
      if (titleEl) {
        var homeTitle = data.title || 'Hi I am\nYuting Feng';
        if (homeTitle.indexOf('\n') >= 0) {
          titleEl.innerHTML = homeTitle.split('\n').map(function(line, i, lines) {
            var safe = escapeHtml(line);
            return i === lines.length - 1 ? '<span class="title-accent">' + safe + '</span>' : safe;
          }).join('<br>');
        } else {
          titleEl.innerHTML = titleWithAccent(homeTitle, 'last');
        }
      }
      if (subEl) subEl.textContent = data.subtitle || 'Data Science & Project Management';
      var videoEl = document.getElementById('home-bg-video');
      var videoName = config && config.pages && config.pages.home && config.pages.home.backgroundVideo;
      var videoUrl = config ? getPageVideo(config, 'home', 'backgroundVideo') : '';
      if (videoEl && videoUrl) {
        videoEl.poster = videoPosterUrl(videoName);
        videoEl.src = videoUrl;
        videoEl.load();
        initVideoScrub(videoEl);
      }
      var contacts = (data.contacts || []).filter(function(c) { return c.label === 'Email'; });
      var email = contacts.length ? contacts[0].value : '';
      setHomeCta(email);
      var pills = document.getElementById('home-pills');
      if (pills) {
        pills.innerHTML = contacts.map(function(c) {
          return '<a class="home-pill" href="' + contactHref(c) + '">' + escapeHtml(c.value) + '</a>';
        }).join('');
        setTimeout(function() { pills.classList.add('is-visible'); }, 400);
      }
    }
    function setAbout(data, config) {
      if (!data) return;
      document.getElementById('about-title').innerHTML = titleWithAccent(data.title || 'About Me');
      var introEl = document.getElementById('about-intro');
      var intro = (data.intro || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      introEl.innerHTML = intro.replace(/\\n/g, '<br>').replace(/\n/g, '<br>');
      var swap = document.getElementById('about-pixel-swap');
      var photoName = config && config.pages && config.pages.about && config.pages.about.badgePhoto;
      var photoUrl = photoName ? ('source/' + photoName) : 'source/bage_photo.jpg';
      var keyboardSrc = getPageAsset(config, 'about', 'backgroundImage') || resolveAsset(pathJoin(paths.pics, 'keyboard.jpg'));
      if (swap && typeof window.mountAboutPixelSwap === 'function') {
        try {
          window.mountAboutPixelSwap(swap, { keyboardSrc: keyboardSrc, frontImage: photoUrl });
        } catch (err) {
          console.error(err);
          swap.innerHTML = '<img class="about-keyboard" src="' + keyboardSrc + '" alt="" />';
        }
      } else if (swap) {
        swap.innerHTML = '<img class="about-keyboard" src="' + keyboardSrc + '" alt="" />';
      }
    }
    function setSkills(data) {
      if (!data) return;
      document.getElementById('skills-title').innerHTML = titleWithAccent(data.title || 'MY SKILLS', 'last');
      document.getElementById('skills-desc').textContent = data.description || '';
      var wrap = document.getElementById('skills-icons');
      wrap.innerHTML = (data.softwareIcons || []).map(function(s) { return '<img src="' + resolvePath(s.src) + '" alt="' + (s.alt || '') + '" title="' + (s.alt || '') + '" />'; }).join('');
    }
    function setExperience(data) {
      if (!data) return;
      var titleEl = document.getElementById('experience-title');
      if (titleEl) titleEl.innerHTML = titleWithAccent(data.title || 'Work Experience');
      var listEl = document.getElementById('experience-list');
      if (!listEl) return;
      var items = Array.isArray(data.items) ? data.items : [];
      listEl.innerHTML = items.map(function(item) {
        var company = escapeHtml(item.company || '');
        var heading = company ? '<h3 class="experience-role">' + company + '</h3>' : '';
        return '<li class="experience-item">' +
          '<div class="experience-period">' + escapeHtml(item.period || '') + '</div>' +
          '<div class="experience-axis" aria-hidden="true"><span class="experience-dot"></span></div>' +
          '<article class="card experience-card">' +
            heading +
            '<p class="experience-summary">' + escapeHtml(item.summary || '') + '</p>' +
          '</article>' +
        '</li>';
      }).join('');
    }
    function encodeAsset(rel) {
      var resolved = resolveAsset(rel);
      if (!resolved || /^(https?:|data:|blob:)/i.test(resolved)) return resolved;
      return encodeURI(resolved);
    }
    var projectGallery = { images: [], index: 0, panY: 0 };
    function applyProjectPan() {
      var img = document.getElementById('project-modal-image');
      if (img) img.style.transform = 'translateY(' + (projectGallery.panY || 0) + 'px)';
    }
    function resetProjectPan() {
      projectGallery.panY = 0;
      applyProjectPan();
    }
    function clampProjectPan() {
      var stage = document.getElementById('project-modal-stage');
      var img = document.getElementById('project-modal-image');
      if (!stage || !img) return;
      var extra = img.offsetHeight - stage.clientHeight;
      var min = extra > 0 ? -extra : 0;
      projectGallery.panY = Math.min(0, Math.max(min, projectGallery.panY || 0));
      applyProjectPan();
    }
    function renderProjectSlide() {
      var img = document.getElementById('project-modal-image');
      var counter = document.getElementById('project-modal-counter');
      var prev = document.getElementById('project-modal-prev');
      var next = document.getElementById('project-modal-next');
      var src = projectGallery.images[projectGallery.index] || '';
      resetProjectPan();
      if (img) {
        img.alt = projectGallery.title || '';
        if (img.src === src && img.complete) {
          clampProjectPan();
        } else {
          img.onload = function() { clampProjectPan(); };
          img.src = src;
        }
      }
      if (counter) {
        counter.textContent = projectGallery.images.length
          ? (projectGallery.index + 1) + ' / ' + projectGallery.images.length
          : '';
      }
      var hideNav = projectGallery.images.length <= 1;
      if (prev) prev.classList.toggle('is-hidden', hideNav);
      if (next) next.classList.toggle('is-hidden', hideNav);
    }
    function stepProjectGallery(delta) {
      var n = projectGallery.images.length;
      if (!n) return;
      projectGallery.index = (projectGallery.index + delta + n) % n;
      renderProjectSlide();
    }
    function closeProjectGallery() {
      var modal = document.getElementById('project-modal');
      if (modal) modal.classList.remove('active');
      document.body.classList.remove('project-modal-open');
      var img = document.getElementById('project-modal-image');
      if (img) {
        img.onload = null;
        img.src = '';
        img.style.transform = '';
      }
      resetProjectPan();
    }
    function openProjectGallery(item) {
      if (!item) return;
      var images = (item.images || []).map(encodeAsset).filter(Boolean);
      var cover = encodeAsset(item.cover || '');
      if (!images.length && cover) images = [cover];
      if (!images.length) return;
      var start = cover ? images.indexOf(cover) : 0;
      projectGallery.images = images;
      projectGallery.index = start >= 0 ? start : 0;
      projectGallery.title = item.name || '';
      renderProjectSlide();
      var modal = document.getElementById('project-modal');
      if (modal) modal.classList.add('active');
      document.body.classList.add('project-modal-open');
    }
    function setProjects(data) {
      var titleEl = document.getElementById('projects-title');
      var grid = document.getElementById('projects-grid');
      if (titleEl && data && data.title) titleEl.textContent = data.title;
      if (!grid) return;
      var items = (data && data.items) || [];
      grid.innerHTML = items.map(function(item, i) {
        var cover = encodeAsset(item.cover || '');
        return '<article class="project-card" data-index="' + i + '">' +
          (cover ? '<img class="project-card-cover" src="' + cover + '" alt="' + escapeHtml(item.name || '') + '" />' : '') +
          '<div class="project-card-body">' +
            '<h3 class="project-card-title">' + escapeHtml(item.name || '') + '</h3>' +
            '<p class="project-card-summary">' + escapeHtml(item.summary || '') + '</p>' +
            '<button type="button" class="project-card-btn">View Detail</button>' +
          '</div>' +
        '</article>';
      }).join('');
      grid.querySelectorAll('.project-card').forEach(function(card) {
        card.addEventListener('click', function() {
          var idx = parseInt(card.dataset.index, 10);
          openProjectGallery(items[idx]);
        });
      });
    }
    function setBoxing(data, config) {
      if (!data) return;
      var avatarUrl = config ? getPageAsset(config, 'boxing', 'avatar') : '';
      var avatarImg = document.getElementById('boxing-avatar');
      if (avatarImg) avatarImg.src = avatarUrl || '';
      document.getElementById('boxing-title').innerHTML = titleWithAccent(data.title || 'ALL IN BOXING', 'last');
      var boxingIntroEl = document.getElementById('boxing-intro');
      var boxingIntro = (data.intro || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      boxingIntroEl.innerHTML = boxingIntro.replace(/\\n/g, '<br>').replace(/\n/g, '<br>');
      var wrap = document.getElementById('boxing-avatar-wrap');
      var overlay = document.getElementById('boxing-intro-overlay');
      var overlayInner = document.getElementById('boxing-intro-overlay-inner');
      var overlayVideo = document.getElementById('boxing-intro-overlay-video');
      var introVideoName = config && config.pages && config.pages.boxing && config.pages.boxing.introVideo;
      var introVideoUrl = introVideoName ? resolveAsset(pathJoin(paths.videos, introVideoName)) : '';
      var introPoster = videoPosterUrl(introVideoName);
      if (overlayVideo && introPoster) overlayVideo.poster = introPoster;
      var avatarVideo = document.getElementById('boxing-avatar-video');
      if (avatarVideo && introPoster) avatarVideo.poster = introPoster;
      function startIntroPlay() {
        if (!overlay || !overlayInner || !overlayVideo || !introVideoUrl) return;
        overlayInner.removeAttribute('style');
        overlayInner.classList.remove('shrinking');
        if (avatarImg) avatarImg.style.visibility = 'hidden';
        overlay.classList.add('visible');
        overlayVideo.src = introVideoUrl;
        overlayVideo.currentTime = 0;
        overlayVideo.play().catch(function() {});
      }
      function onIntroEnded() {
        if (!wrap || !overlayInner || !overlay) return;
        var r = wrap.getBoundingClientRect();
        overlayInner.style.left = r.left + 'px';
        overlayInner.style.top = r.top + 'px';
        overlayInner.style.width = r.width + 'px';
        overlayInner.style.height = r.height + 'px';
        overlayInner.style.marginLeft = '0';
        overlayInner.style.marginTop = '0';
        overlayInner.classList.add('shrinking');
        overlayInner.addEventListener('transitionend', function done() {
          overlayInner.removeEventListener('transitionend', done);
          overlay.classList.remove('visible');
          overlayInner.classList.remove('shrinking');
          overlayInner.removeAttribute('style');
          if (avatarImg) avatarImg.style.visibility = '';
        }, { once: true });
      }
      if (overlayVideo) overlayVideo.onended = onIntroEnded;
      if (wrap && introVideoUrl) {
        wrap.addEventListener('mouseenter', function() {
          if (overlay.classList.contains('visible')) return;
          if (avatarVideo) {
            avatarVideo.src = introVideoUrl;
            avatarVideo.currentTime = 0;
            avatarVideo.loop = false;
            avatarVideo.play().catch(function() {});
            wrap.classList.add('avatar-playing');
          }
        });
        wrap.addEventListener('mouseleave', function() {
          if (avatarVideo) {
            avatarVideo.pause();
            wrap.classList.remove('avatar-playing');
          }
        });
        if (avatarVideo) avatarVideo.onended = function() { wrap.classList.remove('avatar-playing'); };
      }
      window.__boxingStartIntro = introVideoUrl ? startIntroPlay : null;
      if (introVideoUrl && typeof IntersectionObserver !== 'undefined') {
        var boxingSection = document.getElementById('boxing');
        if (boxingSection) {
          var preloaded = false;
          var preloadObs = new IntersectionObserver(function(entries) {
            if (preloaded || !entries[0] || !entries[0].isIntersecting) return;
            preloaded = true;
            var link = document.createElement('link');
            link.rel = 'preload';
            link.as = 'video';
            link.href = introVideoUrl;
            document.head.appendChild(link);
            preloadObs.disconnect();
          }, { rootMargin: '100px', threshold: 0 });
          preloadObs.observe(boxingSection);
        }
      }
      var gallery = document.getElementById('boxing-gallery');
      var mediaList = config ? getPageMediaList(config, 'boxing') : [];
      var imageList = mediaList.filter(function(m) { return m.type === 'image'; });
      var videoList = mediaList.filter(function(m) { return m.type === 'video'; });
      function imageItemHtml(m) { return '<div class="boxing-item" data-type="image" data-src="' + m.src + '"><img src="' + m.thumb + '" alt="" /></div>'; }
      function videoItemHtml(m) { return '<div class="boxing-item" data-type="video" data-src="' + m.src + '"><video class="boxing-item-poster" poster="' + m.thumb + '" preload="none" muted playsinline></video><div class="play-overlay"></div></div>'; }
      gallery.innerHTML = '';
      if (imageList.length > 0) { var imgRow = document.createElement('div'); imgRow.className = 'boxing-gallery-row img-row'; var imgInner = document.createElement('div'); imgInner.className = 'boxing-gallery-inner'; imgInner.innerHTML = imageList.map(imageItemHtml).join('') + imageList.map(imageItemHtml).join(''); imgRow.appendChild(imgInner); gallery.appendChild(imgRow); }
      if (videoList.length > 0) { var vidRow = document.createElement('div'); vidRow.className = 'boxing-gallery-row video-row'; var vidInner = document.createElement('div'); vidInner.className = 'boxing-gallery-inner'; vidInner.innerHTML = videoList.map(videoItemHtml).join('') + videoList.map(videoItemHtml).join(''); vidRow.appendChild(vidInner); gallery.appendChild(vidRow); }
      gallery.querySelectorAll('.boxing-item').forEach(function(el) {
        el.addEventListener('click', function() {
          var type = el.dataset.type, src = el.dataset.src, modal = document.getElementById('media-modal'), wrap = document.getElementById('modal-content-wrap');
          wrap.innerHTML = type === 'video' ? '<video class="modal-content" src="' + src + '" controls autoplay></video>' : '<img class="modal-content" src="' + src + '" alt="" />';
          modal.classList.add('active');
        });
      });
    }
    document.getElementById('modal-close').addEventListener('click', function() { var wrap = document.getElementById('modal-content-wrap'); var v = wrap.querySelector('video'); if (v) v.pause(); wrap.innerHTML = ''; document.getElementById('media-modal').classList.remove('active'); });
    document.getElementById('media-modal').addEventListener('click', function(e) { if (e.target.id === 'media-modal') document.getElementById('modal-close').click(); });
    (function bindProjectModal() {
      var modal = document.getElementById('project-modal');
      var closeBtn = document.getElementById('project-modal-close');
      var prev = document.getElementById('project-modal-prev');
      var next = document.getElementById('project-modal-next');
      var image = document.getElementById('project-modal-image');
      var stage = document.getElementById('project-modal-stage');
      if (closeBtn) closeBtn.addEventListener('click', closeProjectGallery);
      if (prev) prev.addEventListener('click', function(e) { e.stopPropagation(); stepProjectGallery(-1); });
      if (next) next.addEventListener('click', function(e) { e.stopPropagation(); stepProjectGallery(1); });
      if (modal) {
        modal.addEventListener('click', function(e) {
          if (e.target === modal || e.target === stage) closeProjectGallery();
        });
        modal.addEventListener('wheel', function(e) {
          if (!document.body.classList.contains('project-modal-open')) return;
          e.preventDefault();
          clampProjectPan();
          var extra = 0;
          if (stage && image) extra = image.offsetHeight - stage.clientHeight;
          if (extra <= 0) return;
          projectGallery.panY = Math.min(0, Math.max(-extra, (projectGallery.panY || 0) - e.deltaY));
          applyProjectPan();
        }, { passive: false });
      }
      window.addEventListener('resize', function() {
        if (document.body.classList.contains('project-modal-open')) clampProjectPan();
      });
      document.addEventListener('keydown', function(e) {
        if (!document.body.classList.contains('project-modal-open')) return;
        if (e.key === 'Escape') closeProjectGallery();
        if (e.key === 'ArrowLeft') stepProjectGallery(-1);
        if (e.key === 'ArrowRight') stepProjectGallery(1);
      });
    })();
    function updateActiveNav() {
      var sections = document.querySelectorAll('section[id]');
      var navLinks = document.querySelectorAll('.nav-menu a, .nav-overlay-menu a');
      var top = window.scrollY + 80, current = 'home';
      sections.forEach(function(s) { if (s.offsetTop <= top) current = s.id; });
      navLinks.forEach(function(a) { a.classList.toggle('active', a.getAttribute('href') === '#' + current); });
    }
    window.addEventListener('scroll', function() { updateActiveNav(); var nav = document.getElementById('nav'); if (nav) nav.classList.toggle('scrolled', window.scrollY > 60); });
    (function navMobile() {
      var nav = document.getElementById('nav');
      var toggle = document.getElementById('nav-toggle');
      var overlay = document.getElementById('nav-overlay');
      if (!toggle || !nav) return;
      function setOpen(open) {
        nav.classList.toggle('open', open);
        document.body.classList.toggle('nav-menu-open', open);
        if (overlay) {
          overlay.classList.toggle('is-open', open);
          overlay.setAttribute('aria-hidden', open ? 'false' : 'true');
        }
      }
      toggle.addEventListener('click', function(e) { e.stopPropagation(); setOpen(!nav.classList.contains('open')); });
      function closeMenu() { setOpen(false); }
      if (overlay) overlay.addEventListener('click', function(e) { if (e.target.closest('a')) closeMenu(); });
      document.addEventListener('click', function(e) {
        if (!nav.classList.contains('open')) return;
        if (nav.contains(e.target) || (overlay && overlay.contains(e.target))) return;
        closeMenu();
      });
    })();
    function initVideoScrub(video) {
      if (!video || video.dataset.scrubBound === '1') return;
      video.dataset.scrubBound = '1';
      video.muted = true;
      video.playsInline = true;
      video.preload = 'auto';
      var targetTime = 0;
      var lastX = window.innerWidth * 0.5;
      var seeking = false;
      var primed = false;
      var priming = false;
      var raf = 0;
      function duration() {
        return (video && isFinite(video.duration) && video.duration > 0) ? video.duration : 0;
      }
      function clamp(t, dur) {
        if (!dur) return 0;
        return Math.max(0, Math.min(dur - 0.04, t));
      }
      function homeInView() {
        var home = document.getElementById('home');
        if (!home) return true;
        var r = home.getBoundingClientRect();
        return r.bottom > 80 && r.top < window.innerHeight;
      }
      function schedule() {
        if (!raf) raf = requestAnimationFrame(tick);
      }
      function tick() {
        raf = 0;
        var dur = duration();
        if (!dur || !homeInView()) return;
        targetTime = clamp((lastX / Math.max(1, window.innerWidth)) * dur, dur);
        if (!primed) { prime(); return; }
        if (seeking) return;
        if (Math.abs(video.currentTime - targetTime) < 0.03) return;
        seeking = true;
        try { video.currentTime = targetTime; } catch (err) { seeking = false; }
      }
      function prime() {
        if (primed || priming || !duration()) return;
        priming = true;
        var playPromise = video.play();
        function done() {
          try { video.pause(); } catch (err) {}
          primed = true;
          priming = false;
          schedule();
        }
        if (playPromise && playPromise.then) {
          playPromise.then(done).catch(function() {
            priming = false;
            primed = true;
            schedule();
          });
        } else {
          done();
        }
      }
      video.addEventListener('loadedmetadata', function() { prime(); schedule(); });
      video.addEventListener('loadeddata', function() { prime(); schedule(); });
      video.addEventListener('seeked', function() {
        seeking = false;
        if (!duration()) return;
        if (Math.abs(targetTime - video.currentTime) > 0.04) schedule();
      });
      window.addEventListener('mousemove', function(e) {
        lastX = e.clientX;
        schedule();
      });
      window.addEventListener('touchmove', function(e) {
        if (e.touches && e.touches[0]) {
          lastX = e.touches[0].clientX;
          schedule();
        }
      }, { passive: true });
      if (video.readyState >= 1) {
        prime();
        schedule();
      }
    }
    function initVideoHoverPlay(video) {
      if (!video || video.dataset.hoverBound === '1') return;
      video.dataset.hoverBound = '1';
      video.muted = true;
      video.loop = true;
      video.playsInline = true;
      var hoverTarget = video.closest('.about-photo-wrap') || video;
      function play() {
        var p = video.play();
        if (p && p.catch) p.catch(function() {});
      }
      function stop() {
        video.pause();
        try { video.currentTime = 0; } catch (err) {}
      }
      hoverTarget.addEventListener('mouseenter', play);
      hoverTarget.addEventListener('mouseleave', stop);
      hoverTarget.addEventListener('touchstart', function() { play(); }, { passive: true });
    }
        (function init() {
      var el = document.getElementById('page-data');
      if (!el) return;
      var data = JSON.parse(el.textContent);
      var config = data.config;
      if (!config || !config.paths) return;
      paths.pics = config.paths.pics || '';
      paths.icons = config.paths.icons || '';
      paths.videos = config.paths.videos || '';
      paths.contents = config.paths.contents || '';
      var site = data.site, home = data.home, about = data.about, skills = data.skills, experience = data.experience, projects = data.projects, boxing = data.boxing;
      var bgUrl = getPageAsset(config, 'boxing', 'backgroundImage');
      if (bgUrl) {
        var pageBgEl = document.getElementById('page-bg');
        if (pageBgEl) pageBgEl.style.backgroundImage = 'url(' + bgUrl + ')';
      }
      if (site) setNav(site);
      setHome(home, config);
      setAbout(about, config);
      setSkills(skills);
      setExperience(experience);
      setProjects(projects);
      setBoxing(boxing, config);
      updateActiveNav();
    })();
