<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yuting's Life</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
            ring: 'hsl(var(--ring))',
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            primary: { DEFAULT: 'hsl(var(--primary))', foreground: 'hsl(var(--primary-foreground))' },
            secondary: { DEFAULT: 'hsl(var(--secondary))', foreground: 'hsl(var(--secondary-foreground))' },
            destructive: { DEFAULT: 'hsl(var(--destructive))', foreground: 'hsl(var(--destructive-foreground))' },
            muted: { DEFAULT: 'hsl(var(--muted))', foreground: 'hsl(var(--muted-foreground))' },
            accent: { DEFAULT: 'hsl(var(--accent))', foreground: 'hsl(var(--accent-foreground))' },
            card: { DEFAULT: 'hsl(var(--card))', foreground: 'hsl(var(--card-foreground))' },
          },
          borderRadius: { lg: 'var(--radius)', md: 'calc(var(--radius) - 2px)', sm: 'calc(var(--radius) - 4px)' },
        },
      },
    };
  </script>
  <style>
    /* Shadcn UI theme：与 rain 初始界面一致 — 荧光绿 + 毛玻璃 */
    :root {
      --background: 0 0% 5%;
      --foreground: 0 0% 96%;
      --card: 0 0% 6%;
      --card-foreground: 0 0% 96%;
      --primary: 95 87% 68%;
      --primary-foreground: 0 0% 8%;
      --secondary: 120 25% 14%;
      --secondary-foreground: 0 0% 98%;
      --muted: 120 10% 12%;
      --muted-foreground: 0 0% 64%;
      --accent: 95 70% 55%;
      --accent-foreground: 0 0% 98%;
      --destructive: 0 84% 60%;
      --destructive-foreground: 0 0% 98%;
      --border: 120 15% 18%;
      --input: 120 15% 18%;
      --ring: 95 87% 50%;
      --radius: 0.75rem;
      --radius-card: 24px;
      /* rain 同款：荧光绿 + 毛玻璃 */
      --black: #0d0d0d;
      --white: #f5f5f5;
      --green: #a0f069;
      --green-light: #b8f090;
      --glow-hex: #a0f069;
      --glass: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.12);
      --gap: clamp(1.5rem, 4vw, 3rem);
      --title-font: 'Orbitron', 'Bebas Neue', sans-serif;
      --title-glow: 0 0 20px rgba(160, 240, 105, 0.4), 0 0 40px rgba(160, 240, 105, 0.15);
      --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    /* Shadcn-style 组件：保留科技感 */
    /* 统一卡片：rain 同款毛玻璃 + 悬停上浮与荧光绿发光 */
    .card {
      border-radius: var(--radius-card);
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      color: hsl(var(--card-foreground));
      box-shadow: 0 8px 32px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.04);
      transition: transform var(--transition), box-shadow var(--transition-slow), border-color var(--transition);
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.35), 0 0 24px rgba(160, 240, 105, 0.25);
      border-color: rgba(160, 240, 105, 0.35);
    }
    .card-header { padding: 1.25rem 1.5rem 0.5rem; }
    .card-title { font-family: var(--title-font); font-weight: 600; font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: 0.1em; margin-bottom: 0.5rem; color: hsl(var(--card-foreground)); text-shadow: var(--title-glow); }
    .card-title .title-accent { color: var(--glow-hex); text-shadow: 0 0 20px rgba(160, 240, 105, 0.4); }
    .card-description { color: hsl(var(--muted-foreground)); font-size: 0.95rem; margin-top: 0.25rem; }
    .card-content { padding: 0.5rem 1.5rem 1.25rem; }
    .about-intro-text { color: hsl(var(--muted-foreground)); font-size: 0.95rem; max-width: 42ch; white-space: pre-line; line-height: 1.65; }
    .skills-heading { font-family: var(--title-font); font-weight: 600; font-size: clamp(2.5rem, 6vw, 4rem); letter-spacing: 0.12em; color: hsl(var(--foreground)); margin-bottom: 1.5rem; text-shadow: var(--title-glow); text-align: center; }
    .skills-icons { display: flex; flex-wrap: wrap; gap: 1rem; transition: transform var(--transition); }
    .skills-icons img { width: 40px; height: 40px; object-fit: contain; filter: brightness(0) invert(1); opacity: 0.9; }
    .btn { display: inline-flex; align-items: center; justify-content: center; border-radius: calc(var(--radius) - 4px); font-size: 0.875rem; font-weight: 500; transition: background var(--transition), color var(--transition); cursor: pointer; }
    .btn-ghost { background: transparent; color: hsl(var(--foreground)); padding: 0.5rem 1rem; }
    .btn-ghost:hover { background: hsl(var(--accent)); color: hsl(var(--accent-foreground)); }
    .btn-ghost.active { background: hsl(var(--accent)); color: hsl(var(--accent-foreground)); }
    .badge { display: inline-flex; align-items: center; border-radius: 9999px; border: 1px solid hsl(var(--border)); padding: 0.15rem 0.6rem; font-size: 0.75rem; font-weight: 500; background: hsl(var(--primary) / 0.3); color: hsl(var(--primary-foreground)); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: hsl(var(--background));
      color: hsl(var(--foreground));
      line-height: 1.6;
      overflow-x: hidden;
    }
    body.intro-done .intro-overlay { opacity: 0; pointer-events: none; transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
    body.intro-done .intro-glow { opacity: 0; transform: scale(2); transition: opacity 1.5s ease, transform 2s ease; }
    body.intro-done .reveal { opacity: 1; transform: translateY(0); }

    /* 电影级开场：光晕先亮起 */
    .intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 0%, hsl(var(--background)) 70%);
      pointer-events: none;
      transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .intro-glow {
      position: absolute;
      width: 120vmax;
      height: 120vmax;
      left: 50%;
      top: 50%;
      margin-left: -60vmax;
      margin-top: -60vmax;
      background: radial-gradient(circle, rgba(160, 240, 105, 0.22) 0%, rgba(160, 240, 105, 0.06) 25%, transparent 50%);
      border-radius: 50%;
      animation: glow-pulse 2.5s ease-out forwards;
    }
    @keyframes glow-pulse {
      0% { opacity: 0; transform: scale(0.3); }
      40% { opacity: 1; transform: scale(1); }
      100% { opacity: 0.6; transform: scale(1.2); }
    }
    @keyframes border-flow {
      to { transform: rotate(360deg); }
    }

    /* 全站背景图：与光晕同时入场，内容加载后调暗 */
    .page-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      background-color: #000;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      animation: bg-reveal 2.5s ease-out forwards;
    }
    .page-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      pointer-events: none;
      transition: background 1s ease;
    }
    body.intro-done .page-bg::after { background: rgba(0, 0, 0, 0.6); }
    @keyframes bg-reveal {
      0% { opacity: 0; }
      35% { opacity: 1; }
      100% { opacity: 1; }
    }
    body.intro-done .page-bg { animation: none; opacity: 1; }

    /* 主内容：淡入 + 上浮，依次出现 */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .reveal.reveal-nav { transition-delay: 0.4s; }
    .reveal.reveal-home { transition-delay: 0.6s; }
    .reveal.reveal-about { transition-delay: 0.85s; }
    .reveal.reveal-boxing { transition-delay: 1.25s; }
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 0.75rem var(--gap);
      display: flex; align-items: center; justify-content: space-between;
      background: var(--glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--glass-border);
    }
    .nav.scrolled { border-bottom-color: rgba(160, 240, 105, 0.3); box-shadow: 0 2px 12px rgba(0,0,0,0.2); }
    .nav-inner { max-width: 1200px; width: 100%; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .nav-brand { color: hsl(var(--foreground)); text-decoration: none; font-family: var(--title-font); font-weight: 600; font-size: 1.35rem; letter-spacing: 0.12em; text-shadow: var(--title-glow); }
    .nav-brand:hover { color: var(--glow-hex); }
    .nav-menu { display: flex; gap: 0.25rem; }
    .nav-menu a {
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.5rem 1rem;
      border-radius: calc(var(--radius) - 4px);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background var(--transition), color var(--transition), border-color var(--transition), transform var(--transition), box-shadow var(--transition-slow);
    }
    .nav-menu a:hover, .nav-menu a.active {
      color: rgba(200, 235, 170, 0.95);
      background: rgba(160, 240, 105, 0.1);
      border-color: rgba(160, 240, 105, 0.22);
    }
    .nav-menu a:hover {
      transform: translateY(-4px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.2), 0 0 20px rgba(160, 240, 105, 0.25);
    }
    section { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: calc(var(--gap) * 2); position: relative; }
    .section-inner { max-width: 1200px; width: 100%; }
    #home { background-color: hsl(var(--background)); position: relative; overflow: hidden; }
    #home .section-inner { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; }
    .home-hero-image { position: absolute; right: 0; top: 0; bottom: 0; width: 55%; max-width: 720px; background-size: cover; background-position: right center; background-repeat: no-repeat; }
    .home-hero-image::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to right, hsl(var(--background)) 0%, hsl(var(--background) / 0.9) 25%, transparent 55%); pointer-events: none; }
    .home-title { font-family: var(--title-font); font-weight: 700; font-size: clamp(3rem, 10vw, 7rem); letter-spacing: 0.12em; line-height: 0.95; color: hsl(var(--foreground)); margin-bottom: 0.5rem; text-shadow: var(--title-glow); }
    .home-subtitle { font-size: clamp(0.9rem, 2vw, 1.1rem); letter-spacing: 0.15em; text-transform: uppercase; color: hsl(var(--muted-foreground)); margin-bottom: 3rem; }
    .home-contacts { display: flex; flex-wrap: nowrap; gap: 0.75rem; }
    .home-contact-card {
      flex: 1 1 auto;
      min-width: 200px;
      max-width: none;
      border-radius: var(--radius-card);
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 0.6rem 1rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.04);
      transition: transform var(--transition), box-shadow var(--transition-slow), border-color var(--transition);
    }
    .home-contact-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.35), 0 0 24px rgba(160, 240, 105, 0.25);
      border-color: rgba(160, 240, 105, 0.35);
    }
    .home-contact-card a {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: hsl(var(--foreground));
      text-decoration: none;
      font-size: 0.8rem;
      opacity: 0.9;
      width: 100%;
      white-space: nowrap;
      transition: color var(--transition);
    }
    .home-contact-card:hover a { opacity: 1; color: var(--glow-hex); }
    .home-contact-card img { width: 20px; height: 20px; object-fit: contain; filter: brightness(0) invert(1); flex-shrink: 0; }
    #about { background: transparent; }
    /* 左右两列等高：grid stretch + 左列 flex 分栏 */
    #about .section-inner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--gap);
      align-items: stretch;
      min-height: min(70vh, 560px);
    }
    .about-left-col {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .about-me {
      flex: 3;
      padding-right: 0.5rem;
    }
    .about-me .about-title { font-family: var(--title-font); font-weight: 600; font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: 0.1em; color: hsl(var(--foreground)); margin-bottom: 0.5rem; text-shadow: var(--title-glow); }
    .about-me .about-intro-text { color: hsl(var(--muted-foreground)); font-size: 0.95rem; max-width: 42ch; white-space: pre-line; line-height: 1.65; }
    .skills-card {
      flex: 2;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .skills-card .card-header { padding: 1.25rem 1.5rem 0.5rem; }
    .skills-card .card-title { font-size: clamp(1.1rem, 2.5vw, 1.5rem); letter-spacing: 0.08em; margin-bottom: 0.5rem; }
    .skills-card .card-content { padding: 0.5rem 1.5rem 1.25rem; flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 0.5rem; }
    .skills-card .skills-desc { margin: 0 0 0.5rem; font-size: 0.95rem; max-width: none; color: hsl(var(--muted-foreground)); }
    .skills-card .skills-icons { gap: 1rem; justify-content: flex-start; }
    .skills-card .skills-icons img { width: 40px; height: 40px; }
    .about-right-col {
      display: flex;
      align-items: stretch;
      justify-content: center;
    }
    .about-photo-wrap {
      width: fit-content;
      max-width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-card);
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.04);
      transition: transform var(--transition), box-shadow var(--transition-slow), border-color var(--transition);
    }
    .about-photo-wrap:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.35), 0 0 24px rgba(160, 240, 105, 0.25);
      border-color: rgba(160, 240, 105, 0.4);
    }
    .about-photo {
      width: 100%;
      max-width: 380px;
      height: 100%;
      min-height: 280px;
      object-fit: cover;
      border-radius: var(--radius-card);
      transition: opacity var(--transition);
    }
    @keyframes slideInRight { from { opacity: 0; transform: translateX(80px); } to { opacity: 1; transform: translateX(0); } }
    #boxing { background: transparent; background-size: contain; background-position: center; background-repeat: no-repeat; }
    .boxing-header { display: grid; grid-template-columns: auto 1fr; gap: var(--gap); align-items: center; margin-bottom: 3rem; }
    .boxing-avatar-wrap {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
      cursor: pointer;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.04);
      transition: transform var(--transition), box-shadow var(--transition-slow), border-color var(--transition);
    }
    .boxing-avatar-wrap::before {
      content: '';
      position: absolute;
      inset: -3px;
      z-index: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0%, rgba(160,240,105,0.15) 15%, rgba(160,240,105,0.5) 25%, transparent 35%, transparent 65%, rgba(160,240,105,0.25) 75%, rgba(160,240,105,0.1) 85%, transparent 100%);
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    .boxing-avatar-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: 50%;
      background: var(--glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      pointer-events: none;
    }
    .boxing-avatar-wrap:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.35), 0 0 24px rgba(160, 240, 105, 0.25);
      border-color: transparent;
    }
    .boxing-avatar-wrap:hover::before {
      opacity: 1;
      animation: border-flow 2.8s linear infinite;
    }
    .boxing-avatar-wrap .boxing-avatar { width: 100%; height: 100%; object-fit: cover; display: block; border: none; position: relative; z-index: 2; }
    .boxing-avatar-wrap .boxing-avatar-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; border: none; z-index: 2; }
    .boxing-avatar-wrap .boxing-avatar-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; border: none; }
    .boxing-avatar-wrap.avatar-playing .boxing-avatar-video { display: block; }
    .boxing-avatar-wrap.avatar-playing .boxing-avatar { display: none; }
    .boxing-intro-overlay { position: fixed; inset: 0; z-index: 150; background: hsl(var(--background)); display: none; align-items: center; justify-content: center; }
    .boxing-intro-overlay.visible { display: flex; }
    .boxing-intro-overlay-inner { position: fixed; left: 50%; top: 50%; width: 80vmin; height: 80vmin; margin-left: -40vmin; margin-top: -40vmin; border-radius: 16px; overflow: hidden; border: 3px solid var(--green); transition: left 0.6s ease, top 0.6s ease, width 0.6s ease, height 0.6s ease, margin 0.6s ease, border-radius 0.6s ease; }
    .boxing-intro-overlay-inner.shrinking { border-radius: 50%; }
    .boxing-intro-overlay-inner video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .boxing-avatar { width: 160px; height: 160px; border-radius: 50%; object-fit: cover; border: 1px solid var(--glass-border); }
    .boxing-intro-card {
      border-radius: var(--radius-card);
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 1.25rem 1.5rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.04);
      transition: transform var(--transition), box-shadow var(--transition-slow), border-color var(--transition);
    }
    .boxing-intro-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.35), 0 0 24px rgba(160, 240, 105, 0.25);
      border-color: rgba(160, 240, 105, 0.35);
    }
    .boxing-title { font-family: var(--title-font); font-weight: 600; font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: 0.1em; color: hsl(var(--card-foreground)); margin-bottom: 0.5rem; text-shadow: var(--title-glow); }
    .title-accent { color: var(--glow-hex); text-shadow: 0 0 20px rgba(160, 240, 105, 0.4); }
    .boxing-intro { color: hsl(var(--muted-foreground)); font-size: 0.95rem; }
    .boxing-gallery { display: flex; flex-direction: column; gap: 1rem; padding-bottom: 0.5rem; }
    .boxing-gallery-row { overflow: hidden; }
    .boxing-gallery-inner { display: flex; gap: 1rem; width: max-content; }
    .boxing-gallery-row.img-row .boxing-gallery-inner { animation: boxing-scroll-right 45s linear infinite; }
    .boxing-gallery-row.video-row .boxing-gallery-inner { animation: boxing-scroll-left 45s linear infinite; }
    .boxing-gallery-inner:hover { animation-play-state: paused; }
    @keyframes boxing-scroll-right { 0% { transform: translateX(-50%); } 100% { transform: translateX(0); } }
    @keyframes boxing-scroll-left { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    .boxing-item {
      position: relative;
      flex: 0 0 200px;
      width: 200px;
      border-radius: var(--radius-card);
      overflow: hidden;
      cursor: pointer;
      aspect-ratio: 16/10;
      min-height: 0;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.04);
      transition: transform var(--transition), box-shadow var(--transition-slow), border-color var(--transition);
    }
    .boxing-item:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 12px 40px rgba(0,0,0,0.35), 0 0 24px rgba(160, 240, 105, 0.25);
      border-color: rgba(160, 240, 105, 0.35);
    }
    .boxing-item img, .boxing-item video { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: inherit; }
    .boxing-item[data-type="video"] { background: var(--black); }

    function resolvePath(path) {
      if (!path || !paths.pics) return path || '';

      if (path.startsWith('icons/')) return paths.icons + '/' + path.slice(6);

    function pathJoin(base, filename) {
      if (!base || !filename) return '';
      return base.replace(/\/$/, '') + '/' + filename;
    }
    function getPageAsset(config, pageId, key) {
      if (!config || !config.pages || !config.pages[pageId]) return '';

        var thumb = item.type === 'video' ? pathJoin(paths.videos, item.thumb || item.src) : pathJoin(paths.pics, item.thumb || item.src);

      if (words.length === 0) return '';

      var start = -1, end = -1;
      if (mode === 'none') { start = -1; end = -1; }
      else if (mode === 'last') { start = words.length - 1; end = words.length - 1; }
      else if (words.length === 2) { start = 1; end = 1; }
      else { var mid = Math.floor(words.length / 2); end = mid; start = words.length % 2 ? mid : mid - 1; }
      var html = '';

      var avatarImg = document.getElementById('boxing-avatar');
      if (avatarImg) avatarImg.src = avatarUrl || '';
      document.getElementById('boxing-title').innerHTML = titleWithAccent(data.title || 'ALL IN BOXING', 'last');
      document.getElementById('boxing-intro').textContent = data.intro || '';
      var wrap = document.getElementById('boxing-avatar-wrap');
      var overlay = document.getElementById('boxing-intro-overlay');
      var overlayInner = document.getElementById('boxing-intro-overlay-inner');
      var overlayVideo = document.getElementById('boxing-intro-overlay-video');
      var introVideoName = config && config.pages && config.pages.boxing && config.pages.boxing.introVideo;
      var introVideoUrl = introVideoName && paths.videos ? pathJoin(paths.videos, introVideoName) : '';
      function startIntroPlay() {
        if (!overlay || !overlayInner || !overlayVideo || !introVideoUrl) return;
        overlayInner.removeAttribute('style');
        overlayInner.classList.remove('shrinking');
        if (avatarImg) avatarImg.style.visibility = 'hidden';
        overlay.classList.add('visible');
        overlayVideo.src = introVideoUrl;
        overlayVideo.currentTime = 0;
        overlayVideo.play().catch(function() {});
      }
      function onIntroEnded() {
        if (!wrap || !overlayInner || !overlay) return;
        var r = wrap.getBoundingClientRect();
        overlayInner.style.left = r.left + 'px';
        overlayInner.style.top = r.top + 'px';
        overlayInner.style.width = r.width + 'px';
        overlayInner.style.height = r.height + 'px';
        overlayInner.style.marginLeft = '0';
        overlayInner.style.marginTop = '0';
        overlayInner.classList.add('shrinking');
        overlayInner.addEventListener('transitionend', function done() {
          overlayInner.removeEventListener('transitionend', done);
          overlay.classList.remove('visible');
          overlayInner.classList.remove('shrinking');
          overlayInner.removeAttribute('style');
          if (avatarImg) avatarImg.style.visibility = '';
        }, { once: true });
      }
      if (overlayVideo) overlayVideo.onended = onIntroEnded;
      var avatarVideo = document.getElementById('boxing-avatar-video');
      if (wrap && introVideoUrl) {
        wrap.addEventListener('mouseenter', function() {
          if (overlay.classList.contains('visible')) return;
          if (avatarVideo) {
            avatarVideo.src = introVideoUrl;
            avatarVideo.currentTime = 0;
            avatarVideo.loop = false;
            avatarVideo.play().catch(function() {});
            wrap.classList.add('avatar-playing');
          }
        });
        wrap.addEventListener('mouseleave', function() {
          if (avatarVideo) {
            avatarVideo.pause();
            wrap.classList.remove('avatar-playing');
          }
        });
        if (avatarVideo) avatarVideo.onended = function() { wrap.classList.remove('avatar-playing'); };
      }
      window.__boxingStartIntro = introVideoUrl ? startIntroPlay : null;
      if (introVideoUrl && typeof IntersectionObserver !== 'undefined') {
        var boxingSection = document.getElementById('boxing');
        if (boxingSection) {
          var preloaded = false;
          var preloadObs = new IntersectionObserver(function(entries) {
            if (preloaded || !entries[0] || !entries[0].isIntersecting) return;
            preloaded = true;
            var link = document.createElement('link');
            link.rel = 'preload';
            link.as = 'video';
            link.href = introVideoUrl;
            document.head.appendChild(link);
            preloadObs.disconnect();
          }, { rootMargin: '100px', threshold: 0 });
          preloadObs.observe(boxingSection);
        }
      }
      var gallery = document.getElementById('boxing-gallery');
      var mediaList = config ? getPageMediaList(config, 'boxing') : [];
      var imageList = mediaList.filter(function(m) { return m.type === 'image'; });
      var videoList = mediaList.filter(function(m) { return m.type === 'video'; });
      function imageItemHtml(m) { return '<div class="boxing-item" data-type="image" data-src="' + m.src + '"><img src="' + m.thumb + '" alt="" /></div>'; }
      function videoItemHtml(m) { return '<div class="boxing-item" data-type="video" data-src="' + m.src + '"><video class="boxing-item-poster" poster="' + m.thumb + '" preload="none" muted playsinline></video><div class="play-overlay"></div></div>'; }
      gallery.innerHTML = '';
      if (imageList.length > 0) { var imgRow = document.createElement('div'); imgRow.className = 'boxing-gallery-row img-row'; var imgInner = document.createElement('div'); imgInner.className = 'boxing-gallery-inner'; imgInner.innerHTML = imageList.map(imageItemHtml).join('') + imageList.map(imageItemHtml).join(''); imgRow.appendChild(imgInner); gallery.appendChild(imgRow); }
      if (videoList.length > 0) { var vidRow = document.createElement('div'); vidRow.className = 'boxing-gallery-row video-row'; var vidInner = document.createElement('div'); vidInner.className = 'boxing-gallery-inner'; vidInner.innerHTML = videoList.map(videoItemHtml).join('') + videoList.map(videoItemHtml).join(''); vidRow.appendChild(vidInner); gallery.appendChild(vidRow); }
      gallery.querySelectorAll('.boxing-item').forEach(function(el) {
        el.addEventListener('click', function() {
          var type = el.dataset.type, src = el.dataset.src, modal = document.getElementById('media-modal'), wrap = document.getElementById('modal-content-wrap');
          wrap.innerHTML = type === 'video' ? '<video class="modal-content" src="' + src + '" controls autoplay></video>' : '<img class="modal-content" src="' + src + '" alt="" />';
          modal.classList.add('active');
        });
      });
    }
    document.getElementById('modal-close').addEventListener('click', function() { var wrap = document.getElementById('modal-content-wrap'); var v = wrap.querySelector('video'); if (v) v.pause(); wrap.innerHTML = ''; document.getElementById('media-modal').classList.remove('active'); });
    document.getElementById('media-modal').addEventListener('click', function(e) { if (e.target.id === 'media-modal') document.getElementById('modal-close').click(); });
    function updateActiveNav() {
      var sections = document.querySelectorAll('section[id]'), navLinks = document.querySelectorAll('.nav-menu a'), top = window.scrollY + 80, current = 'home';
      sections.forEach(function(s) { if (s.offsetTop <= top) current = s.id; });
      navLinks.forEach(function(a) { a.classList.toggle('active', a.getAttribute('href') === '#' + current); });
    }
    window.addEventListener('scroll', function() { updateActiveNav(); var nav = document.getElementById('nav'); if (nav) nav.classList.toggle('scrolled', window.scrollY > 60); });
    (function navMobile() {
      var nav = document.getElementById('nav');
      var toggle = document.getElementById('nav-toggle');
      var menu = document.getElementById('nav-menu');
      if (!toggle || !menu) return;
      toggle.addEventListener('click', function() { nav.classList.toggle('open'); document.body.classList.toggle('nav-menu-open', nav.classList.contains('open')); });
      function closeMenu() { nav.classList.remove('open'); document.body.classList.remove('nav-menu-open'); }
      menu.addEventListener('click', function(e) { if (e.target.closest('a')) closeMenu(); });
      document.addEventListener('click', function(e) { if (nav.classList.contains('open') && !nav.contains(e.target)) closeMenu(); });
    })();
        (function init() {
      var el = document.getElementById('page-data');
      if (!el) return;
      var data = JSON.parse(el.textContent);
      var config = data.config;
      if (!config || !config.paths) return;
      paths.pics = config.paths.pics || '';
      paths.icons = config.paths.icons || '';
      paths.videos = config.paths.videos || '';
      paths.contents = config.paths.contents || '';
      var site = data.site, home = data.home, about = data.about, skills = data.skills, boxing = data.boxing;
      var bgUrl = getPageAsset(config, 'boxing', 'backgroundImage');
      if (bgUrl) {
        var pageBgEl = document.getElementById('page-bg');
        if (pageBgEl) pageBgEl.style.backgroundImage = 'url(' + bgUrl + ')';
      }
      if (site) setNav(site);
      setHome(home, config);
      setAbout(about, config);
      setSkills(skills);
      setBoxing(boxing, config);
      updateActiveNav();
    })();
  </script>
</body>
