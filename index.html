<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yuting's Life</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet" />
  <link href="https://db.onlinewebfonts.com/c/5ac3fe7c6abd2f62067f266d89671492?family=HelveticaNowDisplay-Medium" rel="stylesheet" />
  <link href="https://db.onlinewebfonts.com/c/1aa3377e489837a26d019bba501e779d?family=HelveticaNowDisplayW01-Rg" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
            ring: 'hsl(var(--ring))',
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            primary: { DEFAULT: 'hsl(var(--primary))', foreground: 'hsl(var(--primary-foreground))' },
            secondary: { DEFAULT: 'hsl(var(--secondary))', foreground: 'hsl(var(--secondary-foreground))' },
            destructive: { DEFAULT: 'hsl(var(--destructive))', foreground: 'hsl(var(--destructive-foreground))' },
            muted: { DEFAULT: 'hsl(var(--muted))', foreground: 'hsl(var(--muted-foreground))' },
            accent: { DEFAULT: 'hsl(var(--accent))', foreground: 'hsl(var(--accent-foreground))' },
            card: { DEFAULT: 'hsl(var(--card))', foreground: 'hsl(var(--card-foreground))' },
          },
          borderRadius: { lg: 'var(--radius)', md: 'calc(var(--radius) - 2px)', sm: 'calc(var(--radius) - 4px)' },
        },
      },
    };
  </script>
  <style>
    /* Shadcn UI theme：与 rain 初始界面一致 — 荧光绿 + 毛玻璃 */
    :root {
      --background: 0 0% 100%;
      --foreground: 0 0% 8%;
      --card: 0 0% 100%;
      --card-foreground: 0 0% 8%;
      --primary: 0 0% 8%;
      --primary-foreground: 0 0% 100%;
      --secondary: 0 0% 96%;
      --secondary-foreground: 0 0% 8%;
      --muted: 0 0% 96%;
      --muted-foreground: 0 0% 40%;
      --accent: 0 0% 8%;
      --accent-foreground: 0 0% 100%;
      --destructive: 0 84% 60%;
      --destructive-foreground: 0 0% 98%;
      --border: 0 0% 90%;
      --input: 0 0% 90%;
      --ring: 0 0% 8%;
      --radius: 0.75rem;
      --radius-card: 24px;
      --black: #111111;
      --white: #ffffff;
      --green: #111111;
      --green-light: #333333;
      --glow-hex: #111111;
      --glass: #ffffff;
      --glass-border: rgba(0, 0, 0, 0.1);
      --gap: clamp(1.5rem, 4vw, 3rem);
      --title-font: 'Orbitron', 'Bebas Neue', sans-serif;
      --title-glow: none;
      --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      --font-heading: 'HelveticaNowDisplay-Medium', 'Helvetica Neue', Arial, sans-serif;
      --font-body: 'HelveticaNowDisplayW01-Rg', 'Helvetica Neue', Arial, sans-serif;
    }
    /* Shadcn-style 组件：保留科技感 */
    /* 统一卡片：rain 同款毛玻璃 + 悬停上浮与荧光绿发光 */
    .card {
      border-radius: var(--radius-card);
      border: 1px solid var(--glass-border);
      background: var(--glass);
      color: hsl(var(--card-foreground));
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
      transition: transform var(--transition), box-shadow var(--transition-slow), border-color var(--transition);
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      border-color: rgba(0, 0, 0, 0.2);
    }
    .card-header { padding: 1.25rem 1.5rem 0.5rem; }
    .card-title { font-family: var(--title-font); font-weight: 600; font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: 0.1em; margin-bottom: 0.5rem; color: hsl(var(--card-foreground)); text-shadow: none; }
    .card-title .title-accent { color: #111; text-shadow: none; }
    .card-description { color: hsl(var(--muted-foreground)); font-size: 0.95rem; margin-top: 0.25rem; }
    .card-content { padding: 0.5rem 1.5rem 1.25rem; }
    .about-intro-text { color: hsl(var(--muted-foreground)); font-size: 0.95rem; max-width: 42ch; white-space: pre-line; line-height: 1.65; }
    .skills-heading { font-family: var(--title-font); font-weight: 600; font-size: clamp(2.5rem, 6vw, 4rem); letter-spacing: 0.12em; color: hsl(var(--foreground)); margin-bottom: 1.5rem; text-shadow: none; text-align: center; }
    .skills-icons { display: flex; flex-wrap: wrap; gap: 1rem; transition: transform var(--transition); }
    .skills-icons img { width: 40px; height: 40px; object-fit: contain; filter: brightness(0); opacity: 0.9; }
    .btn { display: inline-flex; align-items: center; justify-content: center; border-radius: calc(var(--radius) - 4px); font-size: 0.875rem; font-weight: 500; transition: background var(--transition), color var(--transition); cursor: pointer; }
    .btn-ghost { background: transparent; color: hsl(var(--foreground)); padding: 0.5rem 1rem; }
    .btn-ghost:hover { background: hsl(var(--accent)); color: hsl(var(--accent-foreground)); }
    .btn-ghost.active { background: hsl(var(--accent)); color: hsl(var(--accent-foreground)); }
    .badge { display: inline-flex; align-items: center; border-radius: 9999px; border: 1px solid hsl(var(--border)); padding: 0.15rem 0.6rem; font-size: 0.75rem; font-weight: 500; background: hsl(var(--primary) / 0.3); color: hsl(var(--primary-foreground)); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: #fff;
      color: #111;
      line-height: 1.6;
      overflow-x: hidden;
    }
    body.intro-done .intro-overlay { opacity: 0; pointer-events: none; transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
    body.intro-done .intro-glow { opacity: 0; transform: scale(2); transition: opacity 1.5s ease, transform 2s ease; }
    body.intro-done .reveal { opacity: 1; transform: translateY(0); }

    /* 电影级开场：光晕先亮起 */
    .intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      pointer-events: none;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .intro-glow {
      display: none;
    }
    @keyframes glow-pulse {
      0% { opacity: 0; transform: scale(0.3); }
      40% { opacity: 1; transform: scale(1); }
      100% { opacity: 0.6; transform: scale(1.2); }
    }
    @keyframes border-flow {
      to { transform: rotate(360deg); }
    }

    /* 全站背景图：与光晕同时入场，内容加载后调暗 */
    .page-bg {
      display: none;
    }
    .page-bg::after { display: none; }
    @keyframes bg-reveal {
      0% { opacity: 0; }
      35% { opacity: 1; }
      100% { opacity: 1; }
    }
    body.intro-done .page-bg { animation: none; opacity: 1; }

    /* 主内容：淡入 + 上浮，依次出现 */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .reveal.reveal-nav { transition-delay: 0.4s; }
    .reveal.reveal-home { transition-delay: 0.6s; }
    .reveal.reveal-about { transition-delay: 0.85s; }
    .reveal.reveal-boxing { transition-delay: 1.25s; }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    #nav, #home, #about, #boxing { font-family: var(--font-body); color: #111; }
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      padding: 1rem 1.25rem;
      display: flex; align-items: center;
      background: rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.4);
      transition: background 0.3s ease, border-color 0.3s ease;
    }
    @media (min-width: 640px) {
      .nav { padding: 1.25rem 2rem; }
    }
    .nav.scrolled {
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-bottom-color: rgba(255, 255, 255, 0.5);
    }
    .nav-inner { width: 100%; position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; }
    @media (min-width: 768px) {
      .nav-inner { display: grid; grid-template-columns: 1fr auto 1fr; }
      .nav-logo { justify-self: start; }
      .nav-cta { justify-self: end; }
    }
    .nav-logo { display: flex; align-items: center; gap: 0.75rem; }
    .nav-brand {
      color: #000;
      text-decoration: none;
      font-family: var(--font-heading);
      font-size: 21px;
      letter-spacing: -0.025em;
      text-shadow: none;
    }
    @media (min-width: 640px) { .nav-brand { font-size: 26px; } }
    .nav-brand:hover { color: #000; opacity: 0.6; }
    .nav-asterisk { font-size: 25px; color: #000; user-select: none; letter-spacing: -0.02em; line-height: 1; }
    @media (min-width: 640px) { .nav-asterisk { font-size: 30px; } }
    .nav-menu {
      display: none;
      position: static;
      left: auto;
      transform: none;
      flex-direction: row;
      align-items: center;
      justify-self: center;
      font-size: 23px;
      color: #000;
      white-space: nowrap;
    }
    .nav-menu a {
      color: #000;
      text-decoration: none;
      font-size: 23px;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
      padding: 0;
      border: none;
      background: none;
      backdrop-filter: none;
      border-radius: 0;
      transition: opacity 0.2s ease;
    }
    .nav-menu a:hover, .nav-menu a.active {
      color: #000;
      opacity: 0.6;
      background: none;
      border: none;
      transform: none;
      box-shadow: none;
    }
    .nav-sep { color: #000; font-size: 23px; }
    .nav-cta {
      display: none;
      color: #000;
      font-size: 23px;
      text-decoration: underline;
      text-underline-offset: 2px;
      transition: opacity 0.2s ease;
    }
    .nav-cta:hover { opacity: 0.6; }
    @media (min-width: 768px) {
      .nav-menu { display: flex; }
      .nav-cta { display: inline; }
    }
    .nav-overlay {
      position: fixed;
      inset: 0;
      z-index: 9;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 0 2rem;
      gap: 2rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .nav-overlay.is-open { opacity: 1; pointer-events: auto; }
    .nav-overlay-menu { display: flex; flex-direction: column; align-items: flex-start; gap: 2rem; }
    .nav-overlay-menu a {
      color: #000;
      text-decoration: none;
      font-size: 32px;
      font-weight: 500;
      transition: opacity 0.2s ease;
    }
    .nav-overlay-menu a:hover { opacity: 0.6; }
    .nav-overlay-cta { text-decoration: underline !important; text-underline-offset: 2px; }
    @media (min-width: 768px) {
      .nav-overlay { display: none !important; }
    }
    section { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: calc(var(--gap) * 2); position: relative; }
    .section-inner { max-width: 1200px; width: 100%; }
    #home {
      background-color: #fff;
      position: relative;
      overflow: hidden;
      z-index: 1;
      min-height: 100vh;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 1.25rem 3rem;
      color: #111;
    }
    @media (min-width: 640px) {
      #home { padding-left: 2rem; padding-right: 2rem; }
    }
    @media (min-width: 768px) {
      #home { justify-content: center; padding: 0 2.5rem; }
    }
    .home-media {
      position: absolute;
      top: 50%;
      right: 0;
      transform: translateY(-50%);
      z-index: 0;
      width: auto;
      height: auto;
      max-height: 100%;
      max-width: min(58%, 760px);
      pointer-events: none;
    }
    .home-bg-video {
      display: block;
      width: auto;
      height: auto;
      max-height: 100vh;
      max-width: 100%;
      object-fit: contain;
      object-position: right center;
      vertical-align: top;
    }
    .home-video-fade {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(to right, #fff 0%, rgba(255,255,255,0.88) 14%, rgba(255,255,255,0.28) 42%, transparent 68%);
    }
    .home-content {
      position: relative;
      z-index: 10;
      max-width: 42rem;
    }
    .home-title {
      font-family: var(--title-font);
      font-weight: 700;
      font-size: clamp(3rem, 10vw, 7rem);
      letter-spacing: 0.12em;
      line-height: 0.95;
      color: #111;
      margin-bottom: 0.5rem;
    }
    .home-subtitle {
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: hsl(var(--muted-foreground));
      margin-bottom: 2rem;
    }
    .home-pills {
      display: flex;

      transform: translateY(8px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .home-pills.is-visible { opacity: 1; transform: translateY(0); }
    .home-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      appearance: none;
      -webkit-appearance: none;
      background: #111;
      color: #fff;
      border: 1px solid #000;
      border-radius: 9999px;
      font-size: 13px;
      padding: 0.3em 1rem;
      margin: 0 0.2em 0.4em;
      white-space: nowrap;
      text-decoration: none;
      cursor: pointer;
      font-family: inherit;
      line-height: 1.4;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28), 0 0 0 1px rgba(0, 0, 0, 0.35);
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    @media (min-width: 640px) {
      .home-pill { font-size: 15px; padding: 0.3em 1.25rem; }

    .home-pill:hover {
      background: #000;
      color: #fff;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(0, 0, 0, 0.5);
    }
    .home-pill-outline {
      color: #111;
      background: #fff;
      border: 1px solid #111;
      gap: 0.5rem;
    }
    @media (min-width: 640px) { .home-pill-outline { gap: 0.75rem; } }
    .home-pill-outline:hover { background: #111; color: #fff; }
    .home-pill-outline u { text-underline-offset: 1px; }
    .home-copy-icon { width: 12px; height: 12px; flex-shrink: 0; }
    #about, #boxing { background: #fff; }
    /* 左右两列等高：grid stretch + 左列 flex 分栏 */
    #about .section-inner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--gap);
      align-items: stretch;
      min-height: min(70vh, 560px);
    }
    .about-left-col {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .about-me {
      flex: 3;
      padding-right: 0.5rem;
    }
    .about-me .about-title { font-family: var(--title-font); font-weight: 600; font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: 0.1em; color: #111; margin-bottom: 0.5rem; text-shadow: none; }
    .about-me .about-intro-text { color: hsl(var(--muted-foreground)); font-size: 0.95rem; max-width: 42ch; white-space: pre-line; line-height: 1.65; }
    .skills-card {
      flex: 2;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .skills-card .card-header { padding: 1.25rem 1.5rem 0.5rem; }
    .skills-card .card-title { font-size: clamp(1.1rem, 2.5vw, 1.5rem); letter-spacing: 0.08em; margin-bottom: 0.5rem; }
    .skills-card .card-content { padding: 0.5rem 1.5rem 1.25rem; flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 0.5rem; }
    .skills-card .skills-desc { margin: 0 0 0.5rem; font-size: 0.95rem; max-width: none; color: hsl(var(--muted-foreground)); }
    .skills-card .skills-icons { gap: 1rem; justify-content: flex-start; }
    .skills-card .skills-icons img { width: 40px; height: 40px; }
    .about-right-col {
      display: flex;
      align-items: stretch;
      justify-content: center;
    }
    .about-photo-wrap {
      width: fit-content;
      max-width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-card);
      border: 1px solid var(--glass-border);
      background: #fff;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      transition: transform var(--transition), box-shadow var(--transition-slow), border-color var(--transition);
    }

    @keyframes slideInRight { from { opacity: 0; transform: translateX(80px); } to { opacity: 1; transform: translateX(0); } }
    #boxing { background: #fff; }
    .boxing-header { display: grid; grid-template-columns: auto 1fr; gap: var(--gap); align-items: center; margin-bottom: 3rem; }
    .boxing-avatar-wrap {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
      cursor: pointer;
      border: 1px solid var(--glass-border);
      background: #fff;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      transition: transform var(--transition), box-shadow var(--transition-slow), border-color var(--transition);
    }
    .boxing-avatar-wrap::before {
      content: '';
      position: absolute;
      inset: -3px;
      z-index: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0%, rgba(0,0,0,0.08) 15%, rgba(0,0,0,0.35) 25%, transparent 35%, transparent 65%, rgba(0,0,0,0.12) 75%, rgba(0,0,0,0.06) 85%, transparent 100%);

    .boxing-avatar-wrap .boxing-avatar-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; border: none; z-index: 2; }
    .boxing-avatar-wrap .boxing-avatar-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; border: none; }
    .boxing-avatar-wrap.avatar-playing .boxing-avatar-video { display: block; }
    .boxing-avatar-wrap.avatar-playing .boxing-avatar { display: none; }
    .boxing-intro-overlay { position: fixed; inset: 0; z-index: 150; background: hsl(var(--background)); display: none; align-items: center; justify-content: center; }
    .boxing-intro-overlay.visible { display: flex; }

    .boxing-intro-overlay-inner.shrinking { border-radius: 50%; }
    .boxing-intro-overlay-inner video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .boxing-avatar { width: 160px; height: 160px; border-radius: 50%; object-fit: cover; border: 1px solid var(--glass-border); }
    .boxing-intro-card {
      border-radius: var(--radius-card);
      border: 1px solid var(--glass-border);
      background: #fff;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
      transition: transform var(--transition), box-shadow var(--transition-slow), border-color var(--transition);
    }
    .boxing-intro-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      border-color: rgba(0, 0, 0, 0.2);
    }

    function resolvePath(path) {
      if (!path || !paths.pics) return path || '';
      if (path.startsWith('pics/')) return paths.pics + '/' + path.slice(5);
      if (path.startsWith('icons/')) return paths.icons + '/' + path.slice(6);
      if (path.startsWith('videos/')) return paths.videos + '/' + path.slice(7);
      return path;

    function pathJoin(base, filename) {
      if (!base || !filename) return '';
      return base.replace(/\/$/, '') + '/' + filename;
    }
    function pageBase() {
      var p = location.pathname || '/';
      if (p.endsWith('/')) return p;
      var last = p.split('/').pop() || '';
      if (/\.[a-zA-Z0-9]+$/.test(last)) return p.slice(0, p.lastIndexOf('/') + 1) || '/';
      return p + '/';
    }
    function resolveAsset(rel) {
      if (!rel) return '';
      if (/^(https?:|data:|blob:|\/)/i.test(rel)) return rel;
      return pageBase() + rel.replace(/^\.\//, '');

      if (!config || !config.pages || !config.pages[pageId] || !config.pages[pageId].media) return [];
      if (!paths.pics || !paths.videos) return [];
      return config.pages[pageId].media.map(function(item) {
        var src = item.type === 'video' ? resolveAsset(pathJoin(paths.videos, item.src)) : resolveAsset(pathJoin(paths.pics, item.src));
        var thumb = item.type === 'video' ? resolveAsset(pathJoin(paths.videos, item.thumb || item.src)) : resolveAsset(pathJoin(paths.pics, item.thumb || item.src));

      var start = -1, end = -1;
      if (mode === 'none') { start = -1; end = -1; }
      else if (mode === 'last') { start = words.length - 1; end = words.length - 1; }
      else if (words.length === 2) { start = 1; end = 1; }

    }
    function contactHref(c) {
      if (!c || !c.value) return '#';
      if (c.value.indexOf('http') === 0) return c.value;
      if (c.label === 'Email') return 'mailto:' + c.value;
      return 'https://' + c.value;
    }
    function copyIconSvg() {
      return '<svg class="home-copy-icon" viewBox="0 0 12 12" fill="none" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="1.5" y="1.5" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.2"/></svg>';
    }
    function startTypewriter(textEl, cursorEl, text, speed, startDelay) {
      speed = speed || 38;
      startDelay = startDelay == null ? 600 : startDelay;
      var i = 0;
      function tick() {
        if (!textEl) return;
        if (i <= text.length) {
          textEl.textContent = text.slice(0, i);
          i += 1;
          setTimeout(tick, speed);
        } else if (cursorEl) {
          cursorEl.classList.add('is-done');
        }
      }
      setTimeout(tick, startDelay);
    }
    function setHomeCta(email) {
      var href = email ? 'mailto:' + email : '#';
      var cta = document.getElementById('nav-cta');
      var overlayCta = document.getElementById('nav-overlay-cta');
      if (cta) cta.href = href;
      if (overlayCta) overlayCta.href = href;
    }
    function setHome(data, config) {
      if (!data) return;
      var titleEl = document.getElementById('home-title');
      var subEl = document.getElementById('home-subtitle');
      if (titleEl) titleEl.innerHTML = titleWithAccent(data.title || 'YUTING FENG');
      if (subEl) subEl.textContent = data.subtitle || 'Data Science & Project Management';
      var videoEl = document.getElementById('home-bg-video');
      var videoName = config && config.pages && config.pages.home && config.pages.home.backgroundVideo;
      var videoUrl = config ? getPageVideo(config, 'home', 'backgroundVideo') : '';
      if (videoEl && videoUrl) {
        videoEl.poster = videoPosterUrl(videoName);
        videoEl.src = videoUrl;
        videoEl.load();
        initVideoScrub(videoEl);
      }
      var contacts = (data.contacts || []).filter(function(c) { return c.label === 'Email'; });
      var email = contacts.length ? contacts[0].value : '';
      setHomeCta(email);
      var pills = document.getElementById('home-pills');
      if (pills) {
        pills.innerHTML = contacts.map(function(c) {
          return '<a class="home-pill" href="' + contactHref(c) + '">' + escapeHtml(c.value) + '</a>';
        }).join('');
        setTimeout(function() { pills.classList.add('is-visible'); }, 400);
      }
    }
    function setAbout(data, config) {
      if (!data) return;
      document.getElementById('about-title').innerHTML = titleWithAccent(data.title || 'About Me');
      var introEl = document.getElementById('about-intro');
      var intro = (data.intro || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      introEl.innerHTML = intro.replace(/\\n/g, '<br>').replace(/\n/g, '<br>');
      var videoEl = document.getElementById('about-photo');
      var videoName = config && config.pages && config.pages.about && config.pages.about.video;
      var videoUrl = config ? getPageVideo(config, 'about', 'video') : '';
      if (videoEl && videoUrl) {
        videoEl.poster = videoPosterUrl(videoName);
        videoEl.src = videoUrl;
        videoEl.load();
        initVideoHoverPlay(videoEl);
      }
    }
    function setSkills(data) {
      if (!data) return;
      document.getElementById('skills-title').innerHTML = titleWithAccent(data.title || 'MY SKILLS', 'last');
      document.getElementById('skills-desc').textContent = data.description || '';
      var wrap = document.getElementById('skills-icons');
      wrap.innerHTML = (data.softwareIcons || []).map(function(s) { return '<img src="' + resolvePath(s.src) + '" alt="' + (s.alt || '') + '" title="' + (s.alt || '') + '" />'; }).join('');
    }
    function setBoxing(data, config) {
      if (!data) return;
      var avatarUrl = config ? getPageAsset(config, 'boxing', 'avatar') : '';
      var avatarImg = document.getElementById('boxing-avatar');
      if (avatarImg) avatarImg.src = avatarUrl || '';
      document.getElementById('boxing-title').innerHTML = titleWithAccent(data.title || 'ALL IN BOXING', 'last');
      document.getElementById('boxing-intro').textContent = data.intro || '';
      var wrap = document.getElementById('boxing-avatar-wrap');
      var overlay = document.getElementById('boxing-intro-overlay');
      var overlayInner = document.getElementById('boxing-intro-overlay-inner');
      var overlayVideo = document.getElementById('boxing-intro-overlay-video');
      var introVideoName = config && config.pages && config.pages.boxing && config.pages.boxing.introVideo;
      var introVideoUrl = introVideoName ? resolveAsset(pathJoin(paths.videos, introVideoName)) : '';
      function startIntroPlay() {
        if (!overlay || !overlayInner || !overlayVideo || !introVideoUrl) return;
        overlayInner.removeAttribute('style');
        overlayInner.classList.remove('shrinking');
        if (avatarImg) avatarImg.style.visibility = 'hidden';
        overlay.classList.add('visible');
        overlayVideo.src = introVideoUrl;
        overlayVideo.currentTime = 0;
        overlayVideo.play().catch(function() {});
      }
      function onIntroEnded() {
        if (!wrap || !overlayInner || !overlay) return;
        var r = wrap.getBoundingClientRect();
        overlayInner.style.left = r.left + 'px';
        overlayInner.style.top = r.top + 'px';
        overlayInner.style.width = r.width + 'px';
        overlayInner.style.height = r.height + 'px';
        overlayInner.style.marginLeft = '0';
        overlayInner.style.marginTop = '0';
        overlayInner.classList.add('shrinking');
        overlayInner.addEventListener('transitionend', function done() {
          overlayInner.removeEventListener('transitionend', done);
          overlay.classList.remove('visible');
          overlayInner.classList.remove('shrinking');
          overlayInner.removeAttribute('style');
          if (avatarImg) avatarImg.style.visibility = '';
        }, { once: true });
      }
      if (overlayVideo) overlayVideo.onended = onIntroEnded;
      var avatarVideo = document.getElementById('boxing-avatar-video');
      if (wrap && introVideoUrl) {
        wrap.addEventListener('mouseenter', function() {
          if (overlay.classList.contains('visible')) return;
          if (avatarVideo) {
            avatarVideo.src = introVideoUrl;
            avatarVideo.currentTime = 0;
            avatarVideo.loop = false;
            avatarVideo.play().catch(function() {});
            wrap.classList.add('avatar-playing');
          }
        });
        wrap.addEventListener('mouseleave', function() {
          if (avatarVideo) {
            avatarVideo.pause();
            wrap.classList.remove('avatar-playing');
          }
        });
        if (avatarVideo) avatarVideo.onended = function() { wrap.classList.remove('avatar-playing'); };
      }
      window.__boxingStartIntro = introVideoUrl ? startIntroPlay : null;
      if (introVideoUrl && typeof IntersectionObserver !== 'undefined') {
        var boxingSection = document.getElementById('boxing');
        if (boxingSection) {
          var preloaded = false;
          var preloadObs = new IntersectionObserver(function(entries) {
            if (preloaded || !entries[0] || !entries[0].isIntersecting) return;
            preloaded = true;
            var link = document.createElement('link');
            link.rel = 'preload';
            link.as = 'video';
            link.href = introVideoUrl;
            document.head.appendChild(link);
            preloadObs.disconnect();
          }, { rootMargin: '100px', threshold: 0 });
          preloadObs.observe(boxingSection);
        }
      }
      var gallery = document.getElementById('boxing-gallery');
      var mediaList = config ? getPageMediaList(config, 'boxing') : [];
      var imageList = mediaList.filter(function(m) { return m.type === 'image'; });
      var videoList = mediaList.filter(function(m) { return m.type === 'video'; });
      function imageItemHtml(m) { return '<div class="boxing-item" data-type="image" data-src="' + m.src + '"><img src="' + m.thumb + '" alt="" /></div>'; }
      function videoItemHtml(m) { return '<div class="boxing-item" data-type="video" data-src="' + m.src + '"><video class="boxing-item-poster" poster="' + m.thumb + '" preload="none" muted playsinline></video><div class="play-overlay"></div></div>'; }
      gallery.innerHTML = '';
      if (imageList.length > 0) { var imgRow = document.createElement('div'); imgRow.className = 'boxing-gallery-row img-row'; var imgInner = document.createElement('div'); imgInner.className = 'boxing-gallery-inner'; imgInner.innerHTML = imageList.map(imageItemHtml).join('') + imageList.map(imageItemHtml).join(''); imgRow.appendChild(imgInner); gallery.appendChild(imgRow); }
      if (videoList.length > 0) { var vidRow = document.createElement('div'); vidRow.className = 'boxing-gallery-row video-row'; var vidInner = document.createElement('div'); vidInner.className = 'boxing-gallery-inner'; vidInner.innerHTML = videoList.map(videoItemHtml).join('') + videoList.map(videoItemHtml).join(''); vidRow.appendChild(vidInner); gallery.appendChild(vidRow); }
      gallery.querySelectorAll('.boxing-item').forEach(function(el) {
        el.addEventListener('click', function() {
          var type = el.dataset.type, src = el.dataset.src, modal = document.getElementById('media-modal'), wrap = document.getElementById('modal-content-wrap');
          wrap.innerHTML = type === 'video' ? '<video class="modal-content" src="' + src + '" controls autoplay></video>' : '<img class="modal-content" src="' + src + '" alt="" />';
          modal.classList.add('active');
        });
      });
    }
    document.getElementById('modal-close').addEventListener('click', function() { var wrap = document.getElementById('modal-content-wrap'); var v = wrap.querySelector('video'); if (v) v.pause(); wrap.innerHTML = ''; document.getElementById('media-modal').classList.remove('active'); });
    document.getElementById('media-modal').addEventListener('click', function(e) { if (e.target.id === 'media-modal') document.getElementById('modal-close').click(); });
    function updateActiveNav() {
      var sections = document.querySelectorAll('section[id]');
      var navLinks = document.querySelectorAll('.nav-menu a, .nav-overlay-menu a');
      var top = window.scrollY + 80, current = 'home';
      sections.forEach(function(s) { if (s.offsetTop <= top) current = s.id; });
      navLinks.forEach(function(a) { a.classList.toggle('active', a.getAttribute('href') === '#' + current); });
    }
    window.addEventListener('scroll', function() { updateActiveNav(); var nav = document.getElementById('nav'); if (nav) nav.classList.toggle('scrolled', window.scrollY > 60); });
    (function navMobile() {
      var nav = document.getElementById('nav');
      var toggle = document.getElementById('nav-toggle');
      var overlay = document.getElementById('nav-overlay');
      if (!toggle || !nav) return;
      function setOpen(open) {
        nav.classList.toggle('open', open);
        document.body.classList.toggle('nav-menu-open', open);
        if (overlay) {
          overlay.classList.toggle('is-open', open);
          overlay.setAttribute('aria-hidden', open ? 'false' : 'true');
        }
      }
      toggle.addEventListener('click', function(e) { e.stopPropagation(); setOpen(!nav.classList.contains('open')); });
      function closeMenu() { setOpen(false); }
      if (overlay) overlay.addEventListener('click', function(e) { if (e.target.closest('a')) closeMenu(); });
      document.addEventListener('click', function(e) {
        if (!nav.classList.contains('open')) return;
        if (nav.contains(e.target) || (overlay && overlay.contains(e.target))) return;
        closeMenu();
      });
    })();
    function initVideoScrub(video) {
      if (!video || video.dataset.scrubBound === '1') return;
      video.dataset.scrubBound = '1';
      video.muted = true;
      video.playsInline = true;
      var targetTime = 0;
      var seeking = false;
      var primed = false;
      var priming = false;
      function clamp(t, dur) {
        if (!dur || !isFinite(dur) || dur <= 0) return 0;
        return Math.max(0, Math.min(dur, t));
      }
      function homeInView() {
        var home = document.getElementById('home');
        if (!home) return true;
        var r = home.getBoundingClientRect();
        return r.bottom > 80 && r.top < window.innerHeight;
      }
      function seekToTarget() {
        if (!isFinite(video.duration) || video.duration <= 0) return;
        var t = clamp(targetTime, video.duration);
        if (Math.abs(video.currentTime - t) < 0.04) { seeking = false; return; }
        seeking = true;
        try { video.currentTime = t; } catch (err) { seeking = false; }
      }
      function prime() {
        if (primed || priming) return;
        priming = true;
        var playPromise = video.play();
        if (playPromise && playPromise.then) {
          playPromise.then(function() {
            video.pause();
            primed = true;
            priming = false;
            seekToTarget();
          }).catch(function() {
            priming = false;
          });
        } else {
          primed = true;
          priming = false;
          seekToTarget();
        }
      }
      function onPointerX(x) {
        if (!homeInView()) return;
        if (!isFinite(video.duration) || video.duration <= 0) return;
        targetTime = clamp((x / window.innerWidth) * video.duration, video.duration);
        if (!primed) { prime(); return; }
        if (!seeking) seekToTarget();
      }
      video.addEventListener('seeked', function() {
        seeking = false;
        if (!video.duration) return;
        if (Math.abs(clamp(targetTime, video.duration) - video.currentTime) > 0.04) seekToTarget();
      });
      window.addEventListener('mousemove', function(e) { onPointerX(e.clientX); });
      window.addEventListener('touchmove', function(e) {
        if (e.touches && e.touches[0]) onPointerX(e.touches[0].clientX);
      }, { passive: true });
    }
    function initVideoHoverPlay(video) {
      if (!video || video.dataset.hoverBound === '1') return;
      video.dataset.hoverBound = '1';
      video.muted = true;
      video.loop = true;
      video.playsInline = true;
      var hoverTarget = video.closest('.about-photo-wrap') || video;
      function play() {
        var p = video.play();
        if (p && p.catch) p.catch(function() {});
      }
      function stop() {
        video.pause();
        try { video.currentTime = 0; } catch (err) {}
      }
      hoverTarget.addEventListener('mouseenter', play);
      hoverTarget.addEventListener('mouseleave', stop);
      hoverTarget.addEventListener('touchstart', function() { play(); }, { passive: true });
    }
        (function init() {
      var el = document.getElementById('page-data');
      if (!el) return;
      var data = JSON.parse(el.textContent);
      var config = data.config;
      if (!config || !config.paths) return;
      paths.pics = config.paths.pics || '';
      paths.icons = config.paths.icons || '';
      paths.videos = config.paths.videos || '';
      paths.contents = config.paths.contents || '';
      var site = data.site, home = data.home, about = data.about, skills = data.skills, boxing = data.boxing;
      var bgUrl = getPageAsset(config, 'boxing', 'backgroundImage');
      if (bgUrl) {
        var pageBgEl = document.getElementById('page-bg');
        if (pageBgEl) pageBgEl.style.backgroundImage = 'url(' + bgUrl + ')';
      }
      if (site) setNav(site);
      setHome(home, config);
      setAbout(about, config);
      setSkills(skills);
      setBoxing(boxing, config);
      updateActiveNav();
    })();
  </script>
