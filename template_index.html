<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yuting's Life</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet" />
  <link href="https://db.onlinewebfonts.com/c/5ac3fe7c6abd2f62067f266d89671492?family=HelveticaNowDisplay-Medium" rel="stylesheet" />
  <link href="https://db.onlinewebfonts.com/c/1aa3377e489837a26d019bba501e779d?family=HelveticaNowDisplayW01-Rg" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
            ring: 'hsl(var(--ring))',
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            primary: { DEFAULT: 'hsl(var(--primary))', foreground: 'hsl(var(--primary-foreground))' },
            secondary: { DEFAULT: 'hsl(var(--secondary))', foreground: 'hsl(var(--secondary-foreground))' },
            destructive: { DEFAULT: 'hsl(var(--destructive))', foreground: 'hsl(var(--destructive-foreground))' },
            muted: { DEFAULT: 'hsl(var(--muted))', foreground: 'hsl(var(--muted-foreground))' },
            accent: { DEFAULT: 'hsl(var(--accent))', foreground: 'hsl(var(--accent-foreground))' },
            card: { DEFAULT: 'hsl(var(--card))', foreground: 'hsl(var(--card-foreground))' },
          },
          borderRadius: { lg: 'var(--radius)', md: 'calc(var(--radius) - 2px)', sm: 'calc(var(--radius) - 4px)' },
        },
      },
    };
  </script>
  <style>
    /* Shadcn UI theme：与 rain 初始界面一致 — 荧光绿 + 毛玻璃 */
    :root {
      --background: 0 0% 100%;
      --foreground: 0 0% 8%;
      --card: 0 0% 100%;
      --card-foreground: 0 0% 8%;
      --primary: 0 0% 8%;
      --primary-foreground: 0 0% 100%;
      --secondary: 0 0% 96%;
      --secondary-foreground: 0 0% 8%;
      --muted: 0 0% 96%;
      --muted-foreground: 0 0% 40%;
      --accent: 0 0% 8%;
      --accent-foreground: 0 0% 100%;
      --destructive: 0 84% 60%;
      --destructive-foreground: 0 0% 98%;
      --border: 0 0% 90%;
      --input: 0 0% 90%;
      --ring: 0 0% 8%;
      --radius: 0.75rem;
      --radius-card: 24px;
      --black: #111111;
      --white: #ffffff;
      --green: #111111;
      --green-light: #333333;
      --glow-hex: #111111;
      --glass: #ffffff;
      --glass-border: rgba(0, 0, 0, 0.1);
      --gap: clamp(1.5rem, 4vw, 3rem);
      --title-font: 'Orbitron', 'Bebas Neue', sans-serif;
      --title-glow: none;
      --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      --font-heading: 'HelveticaNowDisplay-Medium', 'Helvetica Neue', Arial, sans-serif;
      --font-body: 'HelveticaNowDisplayW01-Rg', 'Helvetica Neue', Arial, sans-serif;
    }
    /* Shadcn-style 组件：保留科技感 */
    /* 统一卡片：rain 同款毛玻璃 + 悬停上浮与荧光绿发光 */
    .card {
      border-radius: var(--radius-card);
      border: 1px solid var(--glass-border);
      background: var(--glass);
      color: hsl(var(--card-foreground));
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
      transition: transform var(--transition), box-shadow var(--transition-slow), border-color var(--transition);
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      border-color: rgba(0, 0, 0, 0.2);
    }
    .card-header { padding: 1.25rem 1.5rem 0.5rem; }
    .card-title { font-family: var(--title-font); font-weight: 600; font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: 0.1em; margin-bottom: 0.5rem; color: hsl(var(--card-foreground)); text-shadow: none; }
    .card-title .title-accent { color: #111; text-shadow: none; }
    .card-description { color: hsl(var(--muted-foreground)); font-size: 0.95rem; margin-top: 0.25rem; }
    .card-content { padding: 0.5rem 1.5rem 1.25rem; }
    .about-intro-text { color: hsl(var(--muted-foreground)); font-size: 0.95rem; max-width: none; white-space: pre-line; line-height: 1.65; }
    .skills-heading { font-family: var(--title-font); font-weight: 600; font-size: clamp(2.5rem, 6vw, 4rem); letter-spacing: 0.12em; color: hsl(var(--foreground)); margin-bottom: 1.5rem; text-shadow: none; text-align: center; }
    .skills-icons { display: flex; flex-wrap: wrap; gap: 1rem; transition: transform var(--transition); }
    .skills-icons img { width: 40px; height: 40px; object-fit: contain; filter: brightness(0); opacity: 0.9; }
    .btn { display: inline-flex; align-items: center; justify-content: center; border-radius: calc(var(--radius) - 4px); font-size: 0.875rem; font-weight: 500; transition: background var(--transition), color var(--transition); cursor: pointer; }
    .btn-ghost { background: transparent; color: hsl(var(--foreground)); padding: 0.5rem 1rem; }
    .btn-ghost:hover { background: hsl(var(--accent)); color: hsl(var(--accent-foreground)); }
    .btn-ghost.active { background: hsl(var(--accent)); color: hsl(var(--accent-foreground)); }
    .badge { display: inline-flex; align-items: center; border-radius: 9999px; border: 1px solid hsl(var(--border)); padding: 0.15rem 0.6rem; font-size: 0.75rem; font-weight: 500; background: hsl(var(--primary) / 0.3); color: hsl(var(--primary-foreground)); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: #fff;
      color: #111;
      line-height: 1.6;
      overflow-x: hidden;
    }
    body.intro-done .intro-overlay { opacity: 0; pointer-events: none; transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
    body.intro-done .intro-glow { opacity: 0; transform: scale(2); transition: opacity 1.5s ease, transform 2s ease; }
    body.intro-done .reveal { opacity: 1; transform: translateY(0); }

    /* 电影级开场：光晕先亮起 */
    .intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      pointer-events: none;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .intro-glow {
      display: none;
    }
    @keyframes glow-pulse {
      0% { opacity: 0; transform: scale(0.3); }
      40% { opacity: 1; transform: scale(1); }
      100% { opacity: 0.6; transform: scale(1.2); }
    }
    @keyframes border-flow {
      to { transform: rotate(360deg); }
    }

    /* 全站背景图：与光晕同时入场，内容加载后调暗 */
    .page-bg {
      display: none;
    }
    .page-bg::after { display: none; }
    @keyframes bg-reveal {
      0% { opacity: 0; }
      35% { opacity: 1; }
      100% { opacity: 1; }
    }
    body.intro-done .page-bg { animation: none; opacity: 1; }

    /* 主内容：淡入 + 上浮，依次出现 */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .reveal.reveal-nav { transition-delay: 0.4s; }
    .reveal.reveal-home { transition-delay: 0.6s; }
    .reveal.reveal-about { transition-delay: 0.85s; }
    .reveal.reveal-experience { transition-delay: 1.05s; }
    .reveal.reveal-projects { transition-delay: 1.15s; }
    .reveal.reveal-boxing { transition-delay: 1.35s; }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    #nav, #home, #about, #experience, #projects, #boxing { font-family: var(--font-body); color: #111; }
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      padding: 1rem 1.25rem;
      display: flex; align-items: center;
      background: rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.4);
      transition: background 0.3s ease, border-color 0.3s ease;
    }
    @media (min-width: 640px) {
      .nav { padding: 1.25rem 2rem; }
    }
    .nav.scrolled {
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-bottom-color: rgba(255, 255, 255, 0.5);
    }
    .nav-inner { width: 100%; position: relative; z-index: 2; display: flex; align-items: center; justify-content: flex-end; }
    @media (min-width: 768px) {
      .nav-inner { display: grid; grid-template-columns: 1fr auto 1fr; }
      .nav-menu { justify-self: center; grid-column: 2; }
      .nav-cta { justify-self: end; grid-column: 3; }
    }
    .nav-menu {
      display: none;
      position: static;
      left: auto;
      transform: none;
      flex-direction: row;
      align-items: center;
      font-family: var(--font-body);
      font-size: 20px;
      color: #000;
      white-space: nowrap;
      gap: 2ch;
    }
    .nav-menu a {
      color: #888;
      text-decoration: none;
      font-family: var(--font-body);
      font-size: 20px;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
      padding: 0;
      border: none;
      background: none;
      backdrop-filter: none;
      border-radius: 0;
      transition: color 0.2s ease, font-family 0.2s ease, letter-spacing 0.2s ease;
    }
    .nav-menu a:hover {
      color: #555;
      background: none;
      border: none;
      transform: none;
      box-shadow: none;
    }
    .nav-menu a.active {
      color: #111;
      font-family: var(--title-font);
      font-weight: 600;
      letter-spacing: 0.08em;
    }
    .nav-cta {
      display: none;
      color: #000;
      font-size: 20px;
      text-decoration: underline;
      text-underline-offset: 2px;
      transition: opacity 0.2s ease;
    }
    .nav-cta:hover { opacity: 0.6; }
    @media (min-width: 768px) {
      .nav-menu { display: flex; }
      .nav-cta { display: inline; }
    }
    .nav-overlay {
      position: fixed;
      inset: 0;
      z-index: 9;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 0 2rem;
      gap: 2rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .nav-overlay.is-open { opacity: 1; pointer-events: auto; }
    .nav-overlay-menu { display: flex; flex-direction: column; align-items: flex-start; gap: 2rem; }
    .nav-overlay-menu a {
      color: #888;
      text-decoration: none;
      font-family: var(--font-body);
      font-size: 32px;
      font-weight: 400;
      transition: color 0.2s ease;
    }
    .nav-overlay-menu a:hover { color: #555; }
    .nav-overlay-menu a.active {
      color: #111;
      font-family: var(--title-font);
      font-weight: 600;
      letter-spacing: 0.08em;
    }
    .nav-overlay-cta { color: #111 !important; text-decoration: underline !important; text-underline-offset: 2px; }
    @media (min-width: 768px) {
      .nav-overlay { display: none !important; }
    }
    section { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: calc(var(--gap) * 2); position: relative; }
    .section-inner { max-width: 1200px; width: 100%; }
    #home, #about, #experience, #boxing {
      --screen-title: clamp(1.45rem, 1.8vw + 3.1vh, 3.5rem);
      --screen-heading: clamp(0.95rem, 0.7vw + 1.4vh, 1.2rem);
      --screen-body: clamp(0.72rem, 0.45vw + 1.15vh, 0.95rem);
      --screen-small: clamp(0.66rem, 0.35vw + 0.95vh, 0.85rem);
      --screen-gap: clamp(0.4rem, 1.55vh, 1.75rem);
      --screen-pad-y: clamp(4.6rem, 8vh, 6.5rem);
      --screen-pad-x: clamp(1.15rem, 4vw, 3rem);
      height: 100vh;
      height: 100svh;
      min-height: 100vh;
      min-height: 100svh;
      max-height: 100vh;
      max-height: 100svh;
      overflow: hidden;
      padding: var(--screen-pad-y) var(--screen-pad-x);
    }
    #projects {
      height: auto;
      max-height: none;
      overflow: visible;
    }
    #home {
      background-color: #fff;
      position: relative;
      overflow: hidden;
      z-index: 1;
      min-height: 100vh;
      height: 100vh;
      color: #111;
    }
    #home .section-inner {
      position: relative;
      z-index: 10;
      display: block;
    }
    .home-media {
      position: absolute;
      top: 0;
      left: 50%;
      right: 0;
      bottom: 0;
      z-index: 0;
      height: 100%;
      width: 50%;
      display: flex;
      align-items: stretch;
      justify-content: flex-start;
      pointer-events: none;
      overflow: hidden;
      background-size: cover;
      background-position: left center;
      background-repeat: no-repeat;
    }
    .home-bg-video {
      display: block;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: 100%;
      object-fit: cover;
      object-position: left center;
    }
    .home-bg-video.is-hidden { display: none; }
    .home-bg-frames {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: left center;
    }
    .home-bg-frames.is-active { display: block; }
    .home-video-fade {
      display: block;
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(to right, #fff 0%, rgba(255,255,255,0.75) 10%, rgba(255,255,255,0.22) 28%, transparent 48%),
        linear-gradient(to left, #fff 0%, transparent 14%),
        linear-gradient(to bottom, #fff 0%, transparent 12%),
        linear-gradient(to top, #fff 0%, transparent 14%);
    }
    .home-content {
      position: relative;
      z-index: 10;
      text-align: left;
      min-width: 0;
      max-width: 50rem;
    }
    .home-title {
      font-family: var(--title-font);
      font-weight: 700;
      font-size: clamp(1.9rem, 4vw + 4.6vh, 6.2rem);
      letter-spacing: 0.06em;
      line-height: 1.08;
      color: #111;
      margin-bottom: 0;
    }
    .home-title .title-accent {
      display: inline-block;
      font-size: 1.22em;
      line-height: 1.02;
    }
    .home-subtitle {
      font-size: clamp(0.78rem, 0.8vw + 1.1vh, 1.1rem);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: hsl(var(--muted-foreground));
      margin-top: 1.1em;
      margin-bottom: clamp(0.9rem, 2.4vh, 2rem);
    }
    .home-pills {
      display: flex;
      flex-wrap: wrap;
      row-gap: 0.25rem;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .home-pills.is-visible { opacity: 1; transform: translateY(0); }
    .home-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      appearance: none;
      -webkit-appearance: none;
      background: #111;
      color: #fff;
      border: 1px solid #000;
      border-radius: 9999px;
      font-size: clamp(12px, 1.4vh, 15px);
      padding: 0.3em 1rem;
      margin: 0 0.2em 0.4em;
      white-space: nowrap;
      text-decoration: none;
      cursor: pointer;
      font-family: inherit;
      line-height: 1.4;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28), 0 0 0 1px rgba(0, 0, 0, 0.35);
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    @media (min-width: 640px) {
      .home-pill { font-size: 15px; padding: 0.3em 1.25rem; }
    }
    .home-pill:hover {
      background: #000;
      color: #fff;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(0, 0, 0, 0.5);
    }
    .home-pill-outline {
      color: #111;
      background: #fff;
      border: 1px solid #111;
      gap: 0.5rem;
    }
    @media (min-width: 640px) { .home-pill-outline { gap: 0.75rem; } }
    .home-pill-outline:hover { background: #111; color: #fff; }
    .home-pill-outline u { text-underline-offset: 1px; }
    .home-copy-icon { width: 12px; height: 12px; flex-shrink: 0; }
    #about, #experience, #projects, #boxing { background: #fff; }
    #about {
      position: relative;
      overflow: hidden;
      min-height: 100vh;
      align-items: stretch;
      --nav-clearance: 5.25rem;
    }
    #about .section-inner {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: stretch;
      width: 100%;
      height: 100%;
      min-height: 0;
      pointer-events: none;
    }
    .about-media {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 50%;
      z-index: 1;
      width: 50%;
      height: auto;
      display: flex;
      align-items: stretch;
      justify-content: flex-start;
      overflow: hidden;
      pointer-events: auto;
    }
    #about-pixel-swap {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .about-left-col {
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
      max-width: min(50%, 36rem);
      pointer-events: auto;
    }
    .about-me {
      flex: 3;
      padding-right: 0;
    }
    .about-me .about-title { font-family: var(--title-font); font-weight: 600; font-size: var(--screen-title); letter-spacing: 0.1em; color: #111; margin-bottom: 0.5rem; text-shadow: none; }
    .about-me .about-intro-text { color: hsl(var(--muted-foreground)); font-size: var(--screen-body); max-width: none; width: 100%; white-space: pre-line; line-height: 1.5; margin-bottom: clamp(0.9em, 2.4vh, 3.3em); }
    .skills-card {
      flex: 2;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .skills-card .card-header { padding: clamp(0.7rem, 1.5vh, 1.25rem) 1.5rem 0.4rem; }
    .skills-card .card-title { font-size: var(--screen-heading); letter-spacing: 0.08em; margin-bottom: 0.4rem; }
    .skills-card .card-content { padding: 0.35rem 1.5rem clamp(0.7rem, 1.4vh, 1.25rem); flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 0.4rem; }
    .skills-card .skills-desc { margin: 0 0 0.4rem; font-size: var(--screen-body); max-width: none; color: hsl(var(--muted-foreground)); line-height: 1.5; }
    .skills-card .skills-icons { gap: 0.75rem; justify-content: flex-start; }
    .skills-card .skills-icons img { width: clamp(28px, 3.6vh, 40px); height: clamp(28px, 3.6vh, 40px); }
    .about-lanyard {
      position: relative;
      width: 100%;
      height: 100%;
    }
    #experience .section-inner { display: flex; flex-direction: column; height: 100%; min-height: 0; }
    .experience-title { font-family: var(--title-font); font-weight: 600; font-size: var(--screen-title); letter-spacing: 0.1em; color: #111; margin-bottom: var(--screen-gap); text-shadow: none; }
    .experience-list { list-style: none; display: flex; flex-direction: column; justify-content: space-between; flex: 1; min-height: 0; gap: var(--screen-gap); margin: 0; padding: 0; }
    .experience-item {
      display: grid;
      grid-template-columns: 9.5rem 2rem 1fr;
      align-items: start;
      column-gap: 1.25rem;
      position: relative;
    }
    .experience-period {
      padding-top: 0.85rem;
      text-align: right;
      font-size: var(--screen-small);
      letter-spacing: 0.04em;
      color: hsl(var(--muted-foreground));
      white-space: nowrap;
      transition: color var(--transition), text-shadow var(--transition);
    }
    .experience-axis {
      position: relative;
      width: 2rem;
      align-self: stretch;
      display: flex;
      justify-content: center;
    }
    .experience-axis::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: calc(var(--screen-gap) * -1);
      left: 50%;
      width: 1px;
      background: rgba(17, 17, 17, 0.18);
      transform: translateX(-50%);
    }
    .experience-item:last-child .experience-axis::before { bottom: auto; height: 1.45rem; }
    .experience-dot {
      position: relative;
      z-index: 1;
      width: 14px;
      height: 14px;
      margin-top: 0.95rem;
      border-radius: 50%;
      border: 1.5px solid #111;
      background: #fff;
      flex-shrink: 0;
      transition: box-shadow var(--transition), transform var(--transition);
    }
    .experience-item:hover .experience-period {
      color: #111;
      text-shadow: 0 2px 10px rgba(17, 17, 17, 0.28), 0 1px 3px rgba(17, 17, 17, 0.16);
    }
    .experience-item:hover .experience-dot {
      transform: scale(1.12);
      box-shadow: 0 4px 14px rgba(17, 17, 17, 0.32), 0 0 0 3px rgba(17, 17, 17, 0.06);
    }

      frameUrls.forEach(function(url) {
        var img = new Image();
        img.src = url;
        images.push(img);
      });
      if (frameEl && frameUrls[0]) frameEl.src = frameUrls[0];
      function showFrame() {
        if (!frameEl || !images.length) return;
        var t = lastX / Math.max(1, window.innerWidth);
        var i = Math.round(t * (images.length - 1));
        i = Math.max(0, Math.min(images.length - 1, i));
        var src = images[i] && images[i].src;
        if (src && frameEl.src !== src) frameEl.src = src;
      }
      function useFrames() {
        if (frameMode || !images.length) return;
        frameMode = true;
        if (video) video.classList.add('is-hidden');
        if (frameEl) frameEl.classList.add('is-active');
        showFrame();
      }
      function onMove(x) {
        lastX = x;
        if (!raf) raf = requestAnimationFrame(function() {
          raf = 0;
          if (frameMode) showFrame();
          else if (video) scheduleVideo();
        });
      }
      var targetTime = 0;
      var seeking = false;
      var primed = false;
      var priming = false;
      var seekTimer = 0;
      function duration() {
        return (video && isFinite(video.duration) && video.duration > 0) ? video.duration : 0;
      }
      function scheduleVideo() {
        if (frameMode || !video) return;
        var dur = duration();
        if (!dur) { useFrames(); return; }
        targetTime = Math.max(0, Math.min(dur - 0.04, (lastX / Math.max(1, window.innerWidth)) * dur));
        if (!primed) { prime(); return; }
        if (seeking) return;
        if (Math.abs(video.currentTime - targetTime) < 0.03) return;
        seeking = true;
        if (seekTimer) clearTimeout(seekTimer);
        seekTimer = setTimeout(function() {
          seeking = false;
          useFrames();
        }, 400);
        try { video.currentTime = targetTime; } catch (err) { seeking = false; useFrames(); }
      }
      function prime() {
        if (primed || priming || !duration() || !video) return;
        priming = true;
        video.muted = true;
        var playPromise = video.play();
        function done() {
          try { video.pause(); } catch (err) {}
          primed = true;
          priming = false;
          scheduleVideo();
        }
        if (playPromise && playPromise.then) {
          playPromise.then(done).catch(function() {
            priming = false;
            useFrames();
          });
        } else {
          done();
        }
      }
      if (video) {
        video.muted = true;
        video.playsInline = true;
        video.addEventListener('loadedmetadata', function() { if (!frameMode) prime(); });
        video.addEventListener('error', useFrames);
        video.addEventListener('seeked', function() {
          seeking = false;
          if (seekTimer) clearTimeout(seekTimer);
        });
      }
      window.addEventListener('mousemove', function(e) { onMove(e.clientX); });
      window.addEventListener('pointerdown', function(e) { if (!frameMode && video) prime(); onMove(e.clientX); });
      window.addEventListener('touchmove', function(e) {
        if (e.touches && e.touches[0]) onMove(e.touches[0].clientX);
      }, { passive: true });
      if (images.length) useFrames();
      else if (video && video.readyState >= 1) prime();
      setTimeout(function() { if (!primed) useFrames(); }, 1500);
    }
    function initVideoHoverPlay(video) {
      if (!video || video.dataset.hoverBound === '1') return;
      video.dataset.hoverBound = '1';
      video.muted = true;
      video.loop = true;
      video.playsInline = true;
      var hoverTarget = video.closest('.about-photo-wrap') || video;
      function play() {
        var p = video.play();
        if (p && p.catch) p.catch(function() {});
      }
      function stop() {
        video.pause();
        try { video.currentTime = 0; } catch (err) {}
      }
      hoverTarget.addEventListener('mouseenter', play);
      hoverTarget.addEventListener('mouseleave', stop);
      hoverTarget.addEventListener('touchstart', function() { play(); }, { passive: true });
    }
    (async function init() {
      var config = await loadJSON(CONFIG_URL);
      if (!config || !config.paths) { console.error('Missing config'); return; }
      paths.pics = config.paths.pics || ''; paths.icons = config.paths.icons || ''; paths.videos = config.paths.videos || ''; paths.contents = config.paths.contents || '';
      var contentsBase = paths.contents;
      var bgUrl = getPageAsset(config, 'boxing', 'backgroundImage');
      if (bgUrl) { var pageBgEl = document.getElementById('page-bg'); if (pageBgEl) pageBgEl.style.backgroundImage = 'url(' + bgUrl + ')'; }
      var site = await loadJSON(contentsBase + '/site.json');
      var home = await loadJSON(contentsBase + '/home.json');
      var about = await loadJSON(contentsBase + '/about.json');
      var skills = await loadJSON(contentsBase + '/skills.json');
      var experience = await loadJSON(contentsBase + '/experience.json');
      var boxing = await loadJSON(contentsBase + '/boxing.json');
      if (site) setNav(site); setHome(home, config); setAbout(about, config); setSkills(skills); setExperience(experience); setProjects(); setBoxing(boxing, config);
      var navRoot = document.getElementById('nav');
      var overlayMenu = document.getElementById('nav-overlay');
      function onNavClick(e) {
        var a = e.target.closest('a');
        if (a && a.getAttribute('href') === '#boxing' && typeof window.__boxingStartIntro === 'function') {
          setTimeout(window.__boxingStartIntro, 100);
        }
      }
      if (navRoot) navRoot.addEventListener('click', onNavClick);
      if (overlayMenu) overlayMenu.addEventListener('click', onNavClick);
      updateActiveNav();
    })();
  </script>
